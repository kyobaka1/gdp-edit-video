:root{--page:#F6F3EE;--card:#FFFFFF;--alt:#FAF7F1;--raised:#EFE8DC;--line:#E3DACA;--line-soft:#EEE7DB;--line-strong:#BBAC90;--ink:#24211E;--body:#57524B;--subtle:#736C61;--brand:#DB0D29;--brand-press:#B70A22;--brand-soft:rgba(219,13,41,.08);--ok:#46702F;--ok-bg:rgba(94,127,67,.14);--warn:#865709;--warn-bg:rgba(212,155,59,.18);--err:#A63E29;--err-bg:rgba(176,67,46,.11);--info:#33587F;--info-bg:rgba(51,88,127,.10);--night:#191714;--night-2:#24211D;--night-line:#3A352F;--night-ink:#EDE7DD;--night-sub:#B9B0A2;--r-sm:6px;--r-md:8px;--r-lg:12px;--sh-md:0 8px 22px -10px rgba(42,40,38,.28);--sh-xl:0 24px 60px -16px rgba(30,26,22,.38);--font:"Averta Std CY","Segoe UI",system-ui,-apple-system,"Helvetica Neue","Noto Sans",Roboto,Arial,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;--side:228px}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:13.5px/1.45 var(--font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}a:hover{color:var(--brand-press)}
h1,h2,h3,h4{text-wrap:pretty}
.mono{font-family:var(--mono);font-size:.9em;letter-spacing:-.01em}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.skip{position:absolute;left:8px;top:-48px;z-index:99;background:var(--card);padding:8px 12px;border-radius:8px;border:1px solid var(--line)}.skip:focus{top:8px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.lg{width:28px;height:28px;stroke-width:1.5}
svg.i.sm{width:14px;height:14px}
.hdr{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.mark{width:32px;height:32px;flex:none;display:block}
.mark img{width:100%;height:100%;display:block}
.brand b{display:block;font-size:14px;letter-spacing:-.01em;line-height:1.2}.brand span{display:block;font-size:12px;color:var(--subtle);line-height:1.2}
.hdr-src{display:flex;align-items:center;gap:10px;margin-left:6px;padding-left:16px;border-left:1px solid var(--line);min-width:0;font-size:12.5px;color:var(--body)}
.hdr-src .when{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill-demo{color:var(--warn);background:var(--warn-bg)}.pill-fs{color:var(--ok);background:var(--ok-bg)}.pill-json{color:var(--info);background:var(--info-bg)}
.hdr-act{margin-left:auto;display:flex;gap:8px;flex:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand);animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--card);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);transition:background .12s,transform .1s}
.btn:hover{background:var(--raised);color:var(--ink)}.btn:active{transform:scale(.97)}
.btn-pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn-pri:hover{background:var(--brand-press);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{height:28px;padding:0 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-md);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--body);flex:none}.ib:hover{background:var(--raised);color:var(--ink)}
.link{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit}.link:hover{color:var(--brand)}
.only-m{display:none}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - 56px)}
.app.collapsed{--side:60px}
.side{position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);background:var(--card);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:var(--r-md);border:0;background:none;cursor:pointer;width:100%;text-align:left;color:var(--body);font-weight:500}
.nav:hover{background:var(--alt);color:var(--ink)}
.nav[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:650}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .n{font-size:11.5px;color:var(--subtle);font-family:var(--mono)}

.inp{height:34px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--card);width:100%;min-width:0}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{height:auto;min-height:66px;padding:8px 10px;resize:vertical;line-height:1.45}
select.inp{appearance:auto}
.inp.ro,.ro{background:var(--alt);border-style:dashed;color:var(--body)}
.variants{display:flex;flex-direction:column;gap:6px}
.var{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);font-size:12.5px}
.var .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files{width:100%;border-collapse:collapse;font-size:12px}
.files td{padding:6px 6px;border-top:1px solid var(--line-soft);vertical-align:middle}
.files td:first-child{font-family:var(--mono);font-size:11.5px;padding-left:0}
.files td.r{text-align:right;white-space:nowrap}
.files .miss{color:var(--subtle)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:12.5px}
.hist li:first-child{border-top:0}
.hist time{color:var(--subtle);font-family:var(--mono);font-size:11.5px}
.hist small{display:block;color:var(--body)}
.dr-foot{display:flex;gap:8px;padding:12px 20px;background:var(--card);border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.dr-foot .sp{flex:1}
.dlg{width:min(540px,calc(100vw - 24px));max-height:calc(100vh - 40px);border-radius:14px;background:var(--card);box-shadow:var(--sh-xl);overflow:auto;margin:auto}
.dlg.wide{width:min(760px,calc(100vw - 24px))}
.dlg[open]{animation:dlgIn .18s cubic-bezier(.34,1.56,.64,1)}
@keyframes dlgIn{from{transform:translateY(8px) scale(.98);opacity:0}}
.dlg-h{padding:18px 20px 4px;display:flex;gap:12px;align-items:flex-start}
.dlg-h>div{flex:1;min-width:0}
.dlg-h h2{margin:0;font-size:16px;letter-spacing:-.01em}.dlg-h p{margin:4px 0 0;color:var(--body);font-size:12.5px}
.dlg-b{padding:12px 20px;display:flex;flex-direction:column;gap:12px}
.dlg-f{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.note{padding:9px 12px;border-radius:var(--r-md);background:var(--alt);font-size:12.5px;color:var(--body);display:flex;gap:8px;align-items:flex-start}
.note svg.i{margin-top:1px}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.err{background:var(--err-bg);color:var(--err)}.note.ok{background:var(--ok-bg);color:var(--ok)}.note.info{background:var(--info-bg);color:var(--info)}
.radios{display:flex;gap:8px}
.radios label{flex:1;display:flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--r-md);cursor:pointer;font-weight:600}
.radios label:has(input:checked){border-color:var(--brand);background:#FFF7F6}
.radios input{accent-color:var(--brand)}
.blist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);margin:0;padding:0;list-style:none}
.blist li{display:flex;gap:10px;padding:7px 10px;border-top:1px solid var(--line-soft);font-size:12px;align-items:flex-start}
.blist li:first-child{border-top:0}
.blist li .nm{flex:0 0 42%;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blist li .rs{flex:1;color:var(--body)}
.blist li.ok .rs{color:var(--ok)}.blist li.bad .rs{color:var(--err)}
pre.ev{margin:0;max-height:52vh;overflow:auto;background:var(--night);color:var(--night-ink);padding:12px 14px;border-radius:var(--r-md);font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.srcopts{display:grid;gap:10px}
.srcopt{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.srcopt.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.srcopt h4{margin:0;font-size:13.5px;display:flex;align-items:center;gap:8px}
.srcopt p{margin:0;font-size:12.5px;color:var(--body)}
.srcopt .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.path{font-family:var(--mono);font-size:12px;background:var(--alt);border:1px dashed var(--line-strong);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
.menu{position:fixed;z-index:60;min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-xl);padding:4px;margin:0;inset:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer;font-size:13px}
.mi:hover,.mi:focus-visible{background:var(--alt);outline:0}
.mi svg.i{color:var(--body)}
.mi-sep{height:1px;background:var(--line-soft);margin:4px 6px}
.toasts{position:fixed;right:16px;bottom:16px;left:auto;top:auto;margin:0;padding:0;border:0;background:transparent;display:flex;flex-direction:column;gap:8px;z-index:80;width:min(380px,calc(100vw - 32px));overflow:visible;pointer-events:none}
.toasts:empty{display:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--ink);color:#fff;box-shadow:var(--sh-xl);font-size:12.5px;animation:dlgIn .2s cubic-bezier(.34,1.56,.64,1)}
.toast .tm{flex:1;min-width:0;overflow-wrap:anywhere}
.toast .tg{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}
.toast.ok .tg{background:#5E7F43}.toast.err .tg{background:#C0503A}.toast.warn .tg{background:#B27A24}.toast.info .tg{background:#33587F}
.toast .ta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.toast .ta button{height:26px;padding:0 9px;border-radius:6px;border:1px solid #5A544C;background:transparent;color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.toast .tx{background:none;border:0;color:#bbb;cursor:pointer;padding:0;width:20px;height:20px}
.scrim{display:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
@media (max-width:1180px){.grid{grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}}
@media (max-width:900px){
.only-m{display:inline-grid}.hide-m{display:none!important}
.app{grid-template-columns:minmax(0,1fr)}
.side{position:fixed;left:0;top:56px;bottom:0;width:260px;z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--sh-xl)}
.app.side-open .side{transform:none}
.app.side-open .scrim{display:block;position:fixed;inset:56px 0 0 0;background:rgba(28,24,20,.35);z-index:35}
.app.collapsed{--side:228px}.app.collapsed .side .lbl,.app.collapsed .side .n,.app.collapsed .side h4,.app.collapsed .side .side-foot{display:revert}
.collapse-btn{display:none}
.hdr-src{border-left:0;padding-left:0;margin-left:0}
.hdr-src .when{display:none}
.stats{display:flex;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.stat{flex:0 0 150px}
.tb-filters{flex-wrap:nowrap;overflow-x:auto;width:100%;order:3;padding-bottom:2px}
.seg{margin-left:0}
.usegrid{grid-template-columns:1fr}
.steps{grid-template-columns:1fr;gap:0}
.step{display:grid;grid-template-columns:4px 110px 1fr;gap:10px;align-items:center;padding:5px 0}
.step .bar{height:100%;min-height:22px;width:4px}
.form-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
.main{padding:12px 12px 120px}
.hdr{padding:0 10px;gap:8px}
.brand span{display:none}
.hdr-act .btn .lbl{display:none}
.hdr-act .btn{padding:0 9px}
.grid{grid-template-columns:1fr}
.media{aspect-ratio:4/4.4}
.search{max-width:none;flex-basis:100%}
.dlg{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:16px 16px 0 0;max-height:92vh}
.dr-sec{padding:14px}
.dr-h{padding:12px 12px 10px 14px}
.dr-player{padding:10px 12px}
.pstage{height:52vh}
.rv{grid-template-columns:1fr}.rv-a{justify-content:flex-start}
.hist li{grid-template-columns:1fr;gap:2px}
.bulk{left:8px;right:8px;transform:none;bottom:8px}
.bulk .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style>
</head>

<script>
'use strict';
/* =====================================================================
   GDP Video Studio · Quản trị jobs — một file HTML độc lập.
   Cấu trúc mã:  (1) tiện ích  (2) schema JSON  (3) adapter dữ liệu
                 (4) dữ liệu demo  (5) bộ đánh giá trạng thái  (6) UI
   ---------------------------------------------------------------------
   SCHEMA · jobs/<id>/management.json   (do giao diện này ghi, schema_version 1)
   {
     "schema_version": 1, "job_id": "<id>",
     "display_name": "Kệ khăn hai cốc hút" | null,     // tên thân thiện, thiếu thì dùng job ID
     "kind": "shop"|"source"|"test"|"unknown"|null,   // loại đã xác nhận; null = chưa xác nhận
     "note": "",
     "reviews": {                                       // ghi nhận thủ công, gắn revision final
       "audio":   [ReviewRecord], "listen": [ReviewRecord], "approve": [ReviewRecord] },
     "usage": { "product_page": [UsageRecord], "shopee_video": [UsageRecord] },
     "lifecycle": { "closed": {by, at, final:FinalRev, note} | null,
                    "archived": {by, at, reason} | null },
     "history": [ {at, by, action, final_sha256?, ref?, reason?, note?, result?} ],
     "updated_at": ISO-8601
   }
   FinalRev     = { sha256: "<hex>"|null, size: <bytes>, mtime: <ms epoch, thời gian sửa file> }
   ReviewRecord = { result: "pass"|"fail", by, at, final: FinalRev, note }
   UsageRecord  = { id, by, at, final: FinalRev, ref, note, revoked: null | {by, at, reason} }
   → Bản ghi chỉ hợp lệ cho final hiện tại khi sha256 khớp (hoặc size+mtime khớp nếu chưa tính hash).
   → Không bao giờ ghi đè meta.json / edl.json / qa.json / output pipeline.
   Các khoá lạ trong management.json được giữ nguyên khi ghi lại.
   ---------------------------------------------------------------------
   SCHEMA · dashboard.settings.json  (gốc Studio, chỉ tùy chọn hiển thị)
   { "schema_version": 1, "root_path": "C:\\Users\\Admin\\gdp-video-studio",
     "default_view": "grid"|"list", "page_size": 24,
     "default_filters": { "scope": "all", "shop": "", ... } | null, "updated_at": ISO }
   Không lưu API key, không sao chép .env / studio/config.py / shop.json.
   ---------------------------------------------------------------------
   SCHEMA · file xuất/nhập JSON
   { "format": "gdp-video-studio.jobs-export", "schema_version": 1, "exported_at", "source",
     "root_path", "shops": [{id,title,brand,color}],
     "jobs": [{ id, dir, meta, edl:{shop,brand,motion}, qa, narration, final_check, motion,
                files: {"final.mp4": {size, mtime}, ...}, final_sha256, management, management_draft? }] }
   ===================================================================== */

/* ---------- (1) tiện ích ---------- */
const DEFAULT_ROOT='C:\\Users\\Admin\\gdp-video-studio';
const LS={prefs:'gdpvs.prefs',operator:'gdpvs.operator',lastSource:'gdpvs.lastSource'}; // localStorage: chỉ tùy chọn hiển thị
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>ESC[c]);
const pad=n=>String(n).padStart(2,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nowIso=()=>new Date().toISOString();
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmtDur=s=>{if(s==null||isNaN(s))return '—';s=Math.round(s);return Math.floor(s/60)+':'+pad(s%60)};
const fmtTime=ms=>{if(!ms)return '—';const d=new Date(ms);return `${pad(d.getHours())}:${pad(d.getMinutes())} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const fmtRel=ms=>{if(!ms)return '—';const d=(Date.now()-ms)/1000;if(d<60)return 'vừa xong';if(d<3600)return Math.floor(d/60)+' phút trước';if(d<86400)return Math.floor(d/3600)+' giờ trước';if(d<86400*7)return Math.floor(d/86400)+' ngày trước';const x=new Date(ms);return `${pad(x.getDate())}/${pad(x.getMonth()+1)}/${x.getFullYear()}`};
const fmtSize=b=>b==null?'—':b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
const isoMs=s=>{const n=Date.parse(s);return isNaN(n)?0:n};
const short=s=>s?String(s).slice(0,8):'';
const safeColor=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#9C968B';
function loadPrefs(){try{return JSON.parse(localStorage.getItem(LS.prefs))||{}}catch{return {}}}
function savePrefs(p){try{localStorage.setItem(LS.prefs,JSON.stringify(p))}catch{}}
function fmtMatch(m){if(m==null)return '—';if(typeof m==='number')return m<=1?Math.round(m*100)+'%':String(m);if(typeof m==='boolean')return m?'khớp':'không khớp';if(typeof m==='object')return m.score!=null?fmtMatch(m.score):(m.ok!=null?fmtMatch(!!m.ok):'có dữ liệu');return String(m)}
function download(name,text){const b=new Blob([text],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

/* ---------- (2) schema management.json ---------- */
const KINDS={shop:'Video theo shop',source:'Nguồn phân tích',test:'Thử nghiệm',unknown:'Chưa phân loại'};
function emptyMgmt(id){return {schema_version:1,job_id:id,display_name:null,kind:null,note:'',reviews:{audio:[],listen:[],approve:[]},usage:{product_page:[],shopee_video:[]},lifecycle:{closed:null,archived:null},history:[],updated_at:null}}
function normalizeMgmt(raw,id){
  const m=emptyMgmt(id);if(!raw||typeof raw!=='object')return m;
  const arr=x=>Array.isArray(x)?x.filter(r=>r&&typeof r==='object'):[];
  return {...raw,...m,
    schema_version:raw.schema_version||1,
    display_name:typeof raw.display_name==='string'&&raw.display_name.trim()?raw.display_name:null,
    kind:KINDS[raw.kind]?raw.kind:null,
    note:typeof raw.note==='string'?raw.note:'',
    reviews:{audio:arr(raw.reviews?.audio),listen:arr(raw.reviews?.listen),approve:arr(raw.reviews?.approve)},
    usage:{product_page:arr(raw.usage?.product_page),shopee_video:arr(raw.usage?.shopee_video)},
    lifecycle:{closed:raw.lifecycle?.closed||null,archived:raw.lifecycle?.archived||null},
    history:arr(raw.history),updated_at:raw.updated_at||null};
}
async function sha256Hex(buf){const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
const WriteErr=(code,msg)=>Object.assign(new Error(msg||code),{code});
function mapFsErr(e){if(e&&e.code)return e;const n=e&&e.name;if(n==='NotAllowedError'||n==='SecurityError')return WriteErr('denied');if(n==='QuotaExceededError')return WriteErr('quota');if(n==='NoModificationAllowedError'||n==='InvalidStateError')return WriteErr('conflict');return WriteErr('io',e&&e.message)}

/* ---------- (3) adapter dữ liệu ----------
   Hợp đồng chung (coding agent có thể thay bằng adapter Python local sau này):
     kind: 'demo'|'fs'|'json'      label: string       canWrite: bool
     async scan() → { rootPath, shops:[{id,title,brand,color,incomplete?}], jobs:[JobRecord],
                      report:{ skipped:[{path,reason}], errors:[{path,reason}] }, settings? }
     async readMedia(job, 'final'|'preview'|'source') → File|null   (UI tự tạo/thu hồi Object URL)
     async hashFinal(job) → sha256 hex (đọc final.mp4 khi cần, không hash cả thư viện)
     async writeManagement(job, data, expectedMtime) → {mtime}  | throw {code:'conflict'|'denied'|'quota'|'io'}
     async reloadManagement(job) → {raw, mtime, error}
     async readEvidence(job, fileName) → {type:'text'|'image'|'none', text?, file?}
     async writeSettings(obj, expectedMtime) → {where:'studio'|'browser', mtime?}
   JobRecord = { id, dir, meta, edl:{shop,brand,motion}|null, qa, narration, finalCheck, motion,
                 files:{ "<tên>": {size, mtime} }, mgmtRaw, mgmtMtime, mgmtError, errors:[{path,reason}], finalSha? } */
const JOB_FILES=['meta.json','analysis.json','edl.draft.json','direct.py','edl.json','music.mp3','narration.json','narration.wav','preview.mp4','final.mp4','qa.json','contact.jpg','logo.json','motion_plan.json','layers.json','DELIVERY.md','final-check.json','final-audiocheck.txt','final-heard.txt','final-visual-review.txt','management.json'];
const EVIDENCE_REF=['final-audiocheck.txt','final-heard.txt','final-visual-review.txt','DELIVERY.md'];

class FsAdapter{
  constructor(root){this.kind='fs';this.label='Dữ liệu thật';this.root=root;this.jobDirs=new Map();this.canWrite=false;this.settingsMtime=null}
  async check(){
    const miss=[];
    try{this.jobsDir=await this.root.getDirectoryHandle('jobs')}catch{miss.push('jobs/')}
    try{this.shopsDir=await (await this.root.getDirectoryHandle('assets')).getDirectoryHandle('shops')}catch{miss.push('assets/shops/')}
    try{this.canWrite=(await this.root.queryPermission({mode:'readwrite'}))==='granted'}catch{this.canWrite=false}
    return {ok:!miss.length,miss};
  }
  async readJSON(dir,name){const fh=await dir.getFileHandle(name);const f=await fh.getFile();return {data:JSON.parse(await f.text()),mtime:f.lastModified}}
  async scan(){
    const {ok,miss}=await this.check();if(!ok)throw new Error('Thiếu '+miss.join(', '));
    const shops=[],report={skipped:[],errors:[]},jobs=[];
    for await(const [name,h] of this.shopsDir.entries()){
      if(h.kind!=='directory')continue;
      try{const {data:s}=await this.readJSON(h,'shop.json');const pal=s.palette||{};
        shops.push({id:name,title:String(s.title||s.name||name),brand:String(s.brand||''),color:safeColor(pal.primary||pal.main||(Array.isArray(pal)?pal[0]:'')||s.color)});
      }catch(e){shops.push({id:name,title:name,color:'#9C968B',incomplete:e.name==='NotFoundError'?'Thiếu shop.json':'shop.json lỗi: '+e.message})}
    }
    const dirs=[];for await(const [name,h] of this.jobsDir.entries())if(h.kind==='directory')dirs.push([name,h]);
    for(let i=0;i<dirs.length;i+=8)await Promise.all(dirs.slice(i,i+8).map(([n,h])=>this.scanJob(n,h,jobs,report)));
    let settings=null;
    try{const r=await this.readJSON(this.root,'dashboard.settings.json');settings=r.data;this.settingsMtime=r.mtime}catch(e){if(e.name!=='NotFoundError')report.errors.push({path:'dashboard.settings.json',reason:e.message})}
    return {rootPath:settings?.root_path||null,shops,jobs,report,settings};
  }
  async scanJob(name,h,jobs,report){
    const path='jobs/'+name;
    if(name.startsWith('_')){report.skipped.push({path,reason:name.startsWith('_delivery')?'Gói giao hàng (bản sao final không đưa vào thư viện)':'Thư mục phụ trợ'});return}
    const files={},handles={};
    try{for await(const [fn,fh] of h.entries())if(fh.kind==='file'){handles[fn]=fh}}catch(e){report.errors.push({path,reason:'Không liệt kê được: '+e.message});return}

  async fileOf(job,name){const dh=this.jobDirs.get(job.id);if(!dh)return null;try{return await (await dh.getFileHandle(name)).getFile()}catch{return null}}
  async resolveInRoot(p){
    if(!p)return null;let s=String(p).replace(/\\/g,'/');const root=(S.rootPath||'').replace(/\\/g,'/').replace(/\/+$/,'');

    const parts=s.split('/').filter(Boolean);if(parts.some(x=>x==='..'))throw new Error('Đường dẫn không hợp lệ');
    let d=this.root;for(let i=0;i<parts.length-1;i++)d=await d.getDirectoryHandle(parts[i]);

}

/* Adapter bộ nhớ: dùng cho Demo và JSON nhập thủ công. Không bao giờ ghi ổ đĩa. */
class MemAdapter{
  constructor(kind,data,name){this.kind=kind;this.label=kind==='demo'?'Demo':'JSON nhập thủ công';this.name=name||'';this.data=data;this.picked={};this.canWrite=true;this.dirty=0}
  async scan(){await sleep(this.kind==='demo'?260:60);const d=this.data;return {rootPath:d.rootPath,shops:clone(d.shops),jobs:d.jobs.map(j=>{const c=clone({...j,_demo:undefined});c._demo=j._demo||null;return c}),report:clone(d.report||{skipped:[],errors:[]}),settings:null}}
  rec(job){return this.data.jobs.find(x=>x.id===job.id)}
  async readMedia(job,which){return this.picked[job.id+':'+which]||null}
  attachMedia(job,which,file){this.picked[job.id+':'+which]=file}
  async hashFinal(job){const f=this.picked[job.id+':final'];if(this.kind==='json'&&f)return sha256Hex(await f.arrayBuffer());const r=this.rec(job);if(r?.finalSha)return r.finalSha;throw new Error('Không có file final để tính SHA-256 — chọn file MP4 tương ứng trước')}
  async writeManagement(job,data,expected){
    await sleep(this.kind==='demo'?220:40);const d=this.rec(job);
    if(d._demo?.writeFail)throw WriteErr(d._demo.writeFail);
    if(d._demo?.conflictOnce&&!d._conflicted){d._conflicted=true;d.mgmtRaw={...(d.mgmtRaw||emptyMgmt(d.id)),note:'(Sửa bên ngoài lúc '+fmtTime(Date.now())+') Shop yêu cầu đổi nhạc nền.',updated_at:nowIso()};d.mgmtMtime=Date.now()}
    if((d.mgmtMtime||null)!==(expected||null))throw WriteErr('conflict');
    d.mgmtRaw=clone(data);d.mgmtMtime=Date.now()+Math.floor(Math.random()*7);this.dirty++;return {mtime:d.mgmtMtime};
  }
  async reloadManagement(job){const d=this.rec(job);return {raw:clone(d.mgmtRaw),mtime:d.mgmtMtime||null,error:d.mgmtError||null}}
  async readEvidence(job,name){
    const d=this.rec(job);if(!d.files[name])return {type:'none'};
    const J=o=>({type:'text',text:JSON.stringify(o,null,2)});
    if(name==='qa.json')return J(d.qa);if(name==='meta.json')return J(d.meta);if(name==='narration.json')return J(d.narration);if(name==='final-check.json')return J(d.finalCheck);if(name==='edl.json')return J(d.edl);
    if(name==='management.json')return d.mgmtError?{type:'text',text:'{\n  "schema_version": 1,\n  "job_id": "'+d.id+'",\n  "usage": { "product_page": [ … ] }\n  }\n}   ← '+d.mgmtError}:J(d.mgmtRaw);
    if(name==='final-audiocheck.txt')return {type:'text',text:'[audiocheck] final.mp4\nloudness: -14.2 LUFS  peak: -1.1 dBTP\nclipping: none\nnarration/music balance: ok\n\n(Bản ghi TXT cũ — không ghi revision/hash của final.)'};
    if(name==='final-heard.txt')return {type:'text',text:'Đã nghe toàn bộ lời đọc bản final. Phát âm "chân không" ở 0:07 hơi nhanh.\n(Bản ghi TXT cũ — không ghi revision/hash.)'};
    if(name==='DELIVERY.md')return {type:'text',text:'# Delivery\n- final.mp4 đã giao cho shop qua Zalo\n- caption đính kèm trong tin nhắn'};
    if(/\.jpg$/.test(name))return {type:'none',note:this.kind==='demo'?'Demo không kèm ảnh contact.jpg thật.':'JSON nhập không chứa ảnh.'};
    return {type:'text',text:`(${this.label}: nội dung ${name} không có trong dữ liệu)`};
  }
  async writeSettings(){return {where:'browser'}}
}

const BRAND_LOGO={GIADUNGPLUS:'giadungplus_official',PHALEDO:'phaledo_official',LTENG:'lteng_vn'};
function shopLogo(s){if(!s)return '';const k=SHOP_LOGOS[s.id]?s.id:BRAND_LOGO[String(s.brand||'').toUpperCase()]||BRAND_LOGO[String(s.id).split('_')[0].toUpperCase()];return SHOP_LOGOS[k]||''}
const shopMark=(s,dot)=>{const u=shopLogo(s);return u?`<img class="slogo" src="${u}" alt="">`:dot?`<span class="sdot" style="background:${safeColor(s.color)}"></span>`:`<i style="background:${safeColor(s.color)}"></i>`};
function shopBadge(j){const s=shopOf(j);return s?`<span class="shop" title="${s.missing?'Không có hồ sơ shop.json cho '+esc(s.id):esc(s.id)}">${shopMark(s)}${esc(s.title)}</span>`:'<span class="shop shop-none" title="edl.json chưa có shop"><i></i>Chưa rõ shop</span>'}
const lifeBadge=l=>{const [t,c,i]=LIFE[l];return `<span class="st st-${c}">${ic(i)}${t}</span>`};
const kindChip=e=>e.kind.k==='shop'&&e.kind.src!=='prefix'?'':`<span class="kchip" title="${e.kind.src==='prefix'?'Gợi ý theo tiền tố tên thư mục — chưa xác nhận':e.kind.src==='mgmt'?'Đã xác nhận trong management.json':''}">${KINDS[e.kind.k]}${e.kind.src==='prefix'?' · gợi ý':''}</span>`;

/* lọc & sắp xếp */
function inScope(j,sc){const l=j.ev.life;switch(sc){case 'all':return l!=='archived';case 'todo':return l!=='archived'&&l!=='closed';case 'library':return l!=='archived'&&j.ev.hasFinal;case 'closed':return l==='closed';case 'archived':return l==='archived'}return true}
function inQuick(j,q){const e=j.ev;switch(q){case 'open':return e.life!=='closed'&&e.life!=='archived';case 'review':return e.life==='review';case 'sp':return e.ready&&!e.archived&&!e.closedValid&&e.sp.st!=='yes';case 'sv':return e.ready&&!e.archived&&!e.closedValid&&e.sv.st!=='yes';case 'closed':return e.life==='closed'}return true}
function matchF(j){const f=S.f,e=j.ev;
  if(f.q){const hay=[e.name,j.id,j.meta?.source,shopOf(j)?.title,effMgmt(j).note].join(' ').toLowerCase();if(!f.q.toLowerCase().trim().split(/\s+/).every(t=>hay.includes(t)))return false}
  if(f.shop&&(f.shop==='__none'?!!j.shop:j.shop!==f.shop))return false;
  if(f.life&&e.life!==f.life)return false;

/* ảnh đại diện: tự trích 1 khung hình từ final (thiếu thì preview) cho các thẻ đang hiện;
   cache IndexedDB theo job + kích thước + giờ sửa file → render lại final thì tự lấy ảnh mới. Không ghi file vào Studio. */
let thumbDbP=null;
function thumbDb(){return thumbDbP||(thumbDbP=new Promise(res=>{try{const r=indexedDB.open('gdpvs.thumbs',1);r.onupgradeneeded=()=>r.result.createObjectStore('t');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch{res(null)}}))}
async function thumbGet(k){const db=await thumbDb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('t').objectStore('t').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch{res(null)}})}
async function thumbPut(k,v){const db=await thumbDb();if(db)try{db.transaction('t','readwrite').objectStore('t').put(v,k)}catch{}}
async function extractFrame(file){
  const url=URL.createObjectURL(file),v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;
  try{
    // ~25% thời lượng (1–6s): qua đoạn logo mở đầu, vào cảnh sản phẩm
    await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('quá thời gian chờ')),15000);v.onloadedmetadata=()=>{const d=v.duration||4;v.currentTime=Math.max(0,Math.min(Math.max(1,d*.25),6,d-.1))};v.onseeked=()=>{clearTimeout(to);res()};v.onerror=()=>{clearTimeout(to);rej(new Error('không giải mã được video'))};v.src=url});
    const sc=Math.min(1,560/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',.8);
  }finally{v.removeAttribute('src');v.load();URL.revokeObjectURL(url)}
}
async function loadThumb(j,force){
  const which=j.ev.hasFinal?'final':j.ev.hasPreview?'preview':null;if(!which)throw new Error('Job chưa có final/preview');
  const f0=S.source==='fs'&&j.files[which+'.mp4'],k=f0?`${j.id}|${which}|${f0.size}|${f0.mtime}`:null;
  if(!force&&k){const c=await thumbGet(k);if(c){j.thumb={url:c,which};return}}
  const f=await S.adapter.readMedia(j,which);if(!f)throw new Error(S.source==='fs'?'Không thấy file video':'Chưa nạp file video — chọn MP4 trước (Xem final → Chọn MP4)');
  j.thumb={url:await extractFrame(f),which};if(k)thumbPut(k,j.thumb.url);
}
function refreshThumb(j){const card=$(`.card[data-id="${byIdSel(j.id)}"]`);if(card&&!(S.inline&&S.inline.id===j.id))card.querySelector('.media').outerHTML=mediaHTML(j);const row=$(`tr[data-id="${byIdSel(j.id)}"]`);if(row)row.outerHTML=rowHTML(j)}
const TQ={q:[],busy:0};
function queueThumbs(list){
  if(S.source!=='fs')return;
  TQ.q=list.filter(j=>!j.thumb&&!j.thumbErr&&(j.ev.hasFinal||j.ev.hasPreview));
  const pump=()=>{while(TQ.busy<2&&TQ.q.length){const j=TQ.q.shift();TQ.busy++;
    loadThumb(j).catch(e=>{j.thumbErr=e.message}).finally(()=>{TQ.busy--;if(S.byId[j.id]===j)refreshThumb(j);pump()})}};
  pump();
}
async function grabFrame(j){
  delete j.thumbErr;
  try{await loadThumb(j,true);refreshThumb(j);toast('ok',`Đã lấy lại ảnh đại diện từ ${j.thumb.which==='final'?'final':'preview'}${S.source==='fs'?' (lưu trong trình duyệt, không ghi file).':' (chỉ trong phiên này).'}`)}

}

async function mutate(j,fn,{quiet,msg}={}){
  if(j.mgmtError){toast('err',`Không ghi: management.json của ${j.id} đang lỗi đọc. Sửa file rồi bấm Làm mới.`);return {ok:false,err:'management.json lỗi đọc'}}

async function persist(j,{quiet,msg}={}){
  j.saveState='saving';j.saveErr=null;refreshJob(j.id);
  try{const r=await S.adapter.writeManagement(j,j.pending,j.mgmtMtime);j.mgmt=normalizeMgmt(j.pending,j.id);j.pending=null;j.mgmtMtime=r.mtime;j.saveState='saved';j.savedAt=Date.now();
    if(S.source==='json'){S.jsonDirty++;renderBanner()}if(S.lostAccess){S.lostAccess=false;renderBanner()}
    if(!quiet)toast('ok',`${msg||'Đã lưu'} — ${savedWhere(j)}`);refreshJob(j.id);return {ok:true}}
  catch(e){j.saveState=e.code==='conflict'?'conflict':'error';j.saveErr=e;if(e.code==='denied'&&S.source==='fs'){S.lostAccess=true;renderBanner()}refreshJob(j.id);

      const by=S.operator||'Không rõ';closeDlg();await mutate(j,m=>{const rec=m.usage[CH[ch]].find(x=>x.id===r.id&&!x.revoked)||m.usage[CH[ch]].find(x=>x.at===r.at&&!x.revoked);if(rec)rec.revoked={by,at:nowIso(),reason};m.history.push({at:nowIso(),by,action:'revoke_'+ch,reason,final_sha256:r.final?.sha256})},{msg:`Đã hủy xác nhận ${CH_LBL[ch]}`})}
  });
}

/* kiểm tra & duyệt thủ công, gắn revision */
async function startReview(j,k){
  if(!j.ev.hasFinal)return toast('warn','Chưa có final để ghi nhận.');
  if(j.mgmtError||j.ev.archived||j.ev.closedValid||j.pending)return dlgBlocked(j,'sp',{txt:j.mgmtError?'management.json đang lỗi đọc.':j.ev.archived?'Job đang lưu trữ.':j.ev.closedValid?'Job đã kết thúc — mở lại job trước.':'Có thay đổi chưa lưu — xử lý trước.'});
  try{await ensureHash(j)}catch(e){return toast('err','Không tính được SHA-256: '+e.message)}
  const e=j.ev;
  if(k==='approve'){const miss=[['QA hình',e.qa],['Âm thanh',e.audio],['Nghe lời đọc',e.listen]].filter(x=>x[1].st!=='pass');
    if(miss.length)return dlgInfo('Chưa thể duyệt sử dụng',`<div class="note warn">${ic('lock')}<span>Duyệt sử dụng là bước cuối, cần các mục sau đạt cho bản final hiện tại:</span></div><ol class="todo">${miss.map(x=>`<li>${x[0]}: ${RV_ST[x[1].st]?.[0]||''}</li>`).join('')}</ol>`)}
  const ctx=k==='audio'?`${EVIDENCE_REF.filter(n=>j.files[n]&&/audio/.test(n)).length?'<div class="note">'+ic('info')+'<span>Có file final-audiocheck.txt cũ — chỉ là tài liệu tham khảo, không gắn revision.</span></div>':''}<p class="nx-none">vs.py audiocheck in kết quả ra terminal. Nghe bản final rồi ghi nhận kết quả tại đây.</p>`:k==='listen'?`<p class="nx-none">narration.match = ${fmtMatch(j.narration?.match)} — chỉ chứng minh đối chiếu giọng đọc, không thay cho việc nghe bản final.</p>`:'<p class="nx-none">Xác nhận bản final hiện tại được phép sử dụng cho shop.</p>';
  openDlg(`<form><div class="dlg-h"><div><h2>${REV_LBL[k]}</h2><p>${esc(e.name)}</p></div>${xBtn}</div><div class="dlg-b">
    <dl class="kv"><dt>Bản final</dt><dd class="mono">${esc(revTxt(curRev(j)))}</dd></dl>${ctx}
    <div class="radios" role="radiogroup" aria-label="Kết quả"><label><input type="radio" name="result" value="pass" checked>${ic('checkc')}Đạt</label><label><input type="radio" name="result" value="fail">${ic('xc')}Không đạt</label></div>
    <label class="fld"><span>Người ${k==='approve'?'duyệt':'kiểm'}</span><input class="inp" name="by" required maxlength="80" value="${esc(S.operator)}" placeholder="Tên người vận hành"></label>
    <label class="fld"><span>Ghi chú <small>· tùy chọn</small></span><textarea class="inp" name="note" rows="2" maxlength="1000"></textarea></label>
    <div class="note">${ic('info')}<span>Ghi vào management.json. Không sửa qa.json hay output pipeline.</span></div>
  </div><div class="dlg-f"><button type="button" class="btn" data-act="dlg-close">Hủy</button><button class="btn btn-pri" type="submit">Ghi nhận</button></div></form>`,async fd=>{
    const by=String(fd.get('by')).trim();if(!by)return true;setOperator(by);const result=fd.get('result'),note=String(fd.get('note')).trim(),f=curRev(j);
    closeDlg();await mutate(j,m=>{m.reviews[k].push({result,by,at:nowIso(),final:f,note});m.history.push({at:nowIso(),by,action:'review_'+k,result,note,final_sha256:f.sha256})},{msg:`Đã ghi nhận ${REV_LBL[k].toLowerCase()}`});
  });
}

/* thao tác hàng loạt — tổng kết trước khi ghi */
function dlgBulk(k){
  const js=[...S.selected].map(id=>S.byId[id]).filter(Boolean),ok=[],bad=[];
  for(const j of js){let r=null;
    if(k==='sp'||k==='sv'){if(j.ev[k].st==='yes')r='Đã xác nhận bản hiện tại';else{const b=blockReason(j,k);if(b)r=b.txt.replace(/:$/,'')+(b.todo?.length?': '+b.todo[0]:'')}}
    else if(k==='close'){if(j.mgmtError)r='management.json lỗi đọc';else if(j.ev.life!=='closable')r=j.ev.closedValid?'Đã kết thúc':'Chưa đủ điều kiện: '+(j.ev.todo[0]||LIFE[j.ev.life][0])}
    else if(k==='archive'){if(j.ev.archived)r='Đã lưu trữ';else if(j.mgmtError)r='management.json lỗi đọc'}
    (r?bad:ok).push([j,r]);}
  const T={sp:'Xác nhận Đăng SP',sv:'Xác nhận Shopee Video',close:'Kết thúc job',archive:'Lưu trữ'}[k];
  const lst=(a,cls)=>`<ul class="blist">${a.map(([j,r])=>`<li class="${cls}"><span class="nm" title="${esc(j.id)}">${esc(j.ev.name)}</span><span class="rs">${esc(r||'Được phép')}</span></li>`).join('')}</ul>`;
  openDlg(`<form><div class="dlg-h"><div><h2>${T} · ${js.length} job đã chọn</h2><p>Được phép: <b>${ok.length}</b> · Bị chặn: <b>${bad.length}</b>. Chỉ các job được phép mới được ghi.</p></div>${xBtn}</div><div class="dlg-b">
    ${ok.length?`<div><b style="font-size:12.5px">Sẽ ghi (${ok.length})</b>${lst(ok,'ok')}</div>`:''}${bad.length?`<div><b style="font-size:12.5px">Bị chặn (${bad.length})</b>${lst(bad,'bad')}</div>`:''}
    ${ok.length?`<label class="fld"><span>Người thực hiện</span><input class="inp" name="by" required maxlength="80" value="${esc(S.operator)}"></label>${k==='sp'||k==='sv'||k==='archive'?`<label class="fld"><span>${k==='archive'?'Lý do':'Ghi chú'} <small>· tùy chọn, áp dụng cho tất cả</small></span><input class="inp" name="note" maxlength="500"></label>`:''}`:''}
    ${(k==='sp'||k==='sv')&&ok.length?`<div class="note">${ic('info')}<span>Mỗi job được gắn SHA-256 của bản final hiện tại. Không gọi API Shopee.</span></div>`:''}
  </div><div class="dlg-f"><button type="button" class="btn" data-act="dlg-close">Hủy</button>${ok.length?`<button class="btn btn-pri" type="submit">${k==='sp'||k==='sv'?'Xác nhận đã đăng':T} (${ok.length})</button>`:''}</div></form>`,async fd=>{
    const by=String(fd.get('by')||'').trim();if(!by)return true;setOperator(by);const note=String(fd.get('note')||'').trim();
    $('#dlg .dlg-b').innerHTML=`<div class="note">${ic('clock')}<span>Đang ghi ${ok.length} job…</span></div>`;$$('#dlg .dlg-f .btn').forEach(b=>b.disabled=true);
    const res=[];
    for(const [j] of ok){let r;
      try{
        if(k==='sp'||k==='sv'){await ensureHash(j);j.ev=evaluate(j);if(j.ev[k].st==='yes'){res.push([j,'Đã xác nhận (khớp bản hiện tại)',true]);continue}if(blockReason(j,k)){res.push([j,'Bị chặn sau khi đối chiếu hash',false]);continue}
          const f=curRev(j),rec={id:uid(),by,at:nowIso(),final:f,ref:'',note,revoked:null};r=await mutate(j,m=>{m.usage[CH[k]].push(rec);m.history.push({at:rec.at,by,action:'confirm_'+k,final_sha256:f.sha256,note})},{quiet:true})}
        else if(k==='close'){const f=curRev(j);r=await mutate(j,m=>{m.lifecycle.closed={by,at:nowIso(),final:f,note:''};m.history.push({at:nowIso(),by,action:'close',final_sha256:f.sha256})},{quiet:true})}
        else{r=await mutate(j,m=>{m.lifecycle.archived={by,at:nowIso(),reason:note};m.history.push({at:nowIso(),by,action:'archive',reason:note})},{quiet:true})}
        res.push([j,r.ok?'Đã ghi':'Lỗi: '+r.err,r.ok]);
      }catch(e){res.push([j,'Lỗi: '+e.message,false])}}
    const nOk=res.filter(x=>x[2]).length;
    $('#dlg .dlg-h p').innerHTML=`Kết quả: <b>${nOk}</b> thành công · <b>${res.length-nOk}</b> lỗi${S.source!=='fs'?' · '+esc(S.source==='demo'?'bộ nhớ demo, không ghi Studio':'bản JSON nhập, nhớ Xuất JSON'):''}`;
    $('#dlg .dlg-b').innerHTML=`<ul class="blist">${res.map(([j,t,o])=>`<li class="${o?'ok':'bad'}"><span class="nm">${esc(j.ev.name)}</span><span class="rs">${esc(t)}</span></li>`).join('')}</ul>${res.some(x=>!x[2])?'<div class="note warn">'+ic('alert')+'<span>Job lỗi vẫn giữ thay đổi chưa lưu trong trang — mở từng job để thử lại hoặc tải bản nháp.</span></div>':''}`;
    $('#dlg .dlg-f').innerHTML='<button type="button" class="btn btn-pri" data-act="dlg-close">Xong</button>';
    toast(nOk===res.length?'ok':'warn',`${T}: ${nOk}/${res.length} job thành công`);
    return true;
  });
}

async function renderPlayer(){

  if(!w){st.innerHTML=`<div class="pmsg">${ic('film','lg')}<b>${j.ev.finalLost?'Final bị mất':'Chưa có video để xem'}</b><span>${j.ev.finalLost?'management.json có ghi nhận cho một bản final nhưng không thấy final.mp4 trong thư mục job.':'Job chưa có final, preview hoặc file nguồn.'}</span></div>`;renderPinfo();return}

async function loadFrom(adapter,{silent}={}){
  S.scanning=true;renderHeader();
  try{
    const r=await adapter.scan();
    stopInline();releaseAllMedia();
    const first=S.adapter!==adapter;S.adapter=adapter;S.source=adapter.kind;S.lostAccess=false;
    if(r.rootPath)S.rootPath=r.rootPath;
    if(first&&r.settings){const s=r.settings;if(s.default_view)S.view=s.default_view==='list'?'list':'grid';if(+s.page_size)S.pageSize=+s.page_size;if(s.default_filters)applyFilters(s.default_filters)}
    S.shops=r.shops;S.shopMap=Object.fromEntries(r.shops.map(s=>[s.id,s]));
    S.jobs=r.jobs.map(x=>{const j={...x,shop:x.edl?.shop||null,mgmt:normalizeMgmt(x.mgmtRaw,x.id),pending:null,saveState:x.mgmtRaw?'saved':'none',finalSha:x.finalSha||null,qaError:x.qaError||null};const hc=S.hashCache[j.id],f=j.files['final.mp4'];if(!j.finalSha&&hc&&f&&hc.size===f.size&&hc.mtime===f.mtime)j.finalSha=hc.sha;j.ev=evaluate(j);return j});
    S.byId=Object.fromEntries(S.jobs.map(j=>[j.id,j]));S.report=r.report||{skipped:[],errors:[]};S.scannedAt=Date.now();
    if(first)S.selected.clear();
    if(adapter.kind!=='demo')try{localStorage.setItem(LS.lastSource,adapter.kind)}catch{}
    S.scanning=false;renderAll();
    if(S.drawerId){if(S.byId[S.drawerId])renderDrawer(true);else closeDrawer()}
    if(!silent)toast('ok',`Đã quét ${S.jobs.length} jobs${adapter.kind==='demo'?' (demo)':''} · bỏ qua ${S.report.skipped.length} · ${S.report.errors.length} lỗi đọc`);
  }catch(e){S.scanning=false;renderHeader();toast('err','Quét thất bại: '+e.message+(adapter.kind==='fs'?' — có thể đã mất quyền đọc, hãy kết nối lại.':''),adapter.kind==='fs'?[{l:'Kết nối lại',f:connectFs}]:null)}
}

  toast('ok',`Đã nhập ${jobs.length} jobs từ ${file.name}${report.errors.length?` · ${report.errors.length} mục lỗi`:''}`);
}
function applyFilters(o){if(!o||typeof o!=='object')return;if(SCOPES.some(s=>s[0]===o.scope))S.scope=o.scope;if(QUICK_LBL[o.quick])S.quick=o.quick;for(const k of Object.keys(S.f))if(typeof o[k]==='string')S.f[k]=o[k];if(SORTS.some(s=>s[0]===o.sort))S.sort=o.sort}
function persistPrefs(){savePrefs({view:S.view,pageSize:S.pageSize,collapsed:S.collapsed,filters:S.defaultFilters,rootPath:S.rootPath})}
function dlgSettings(){
  const fsOK='showDirectoryPicker' in window;let framed=false;try{framed=window.top!==window.self}catch{framed=true}
  const opt=(k,v,t)=>`<option value="${v}" ${String(k)===String(v)?'selected':''}>${t}</option>`;
  openDlg(`<form><div class="dlg-h"><div><h2>Thiết lập</h2><p>Nguồn dữ liệu và tùy chọn hiển thị.</p></div>${xBtn}</div><div class="dlg-b">
  <div class="srcopts">
    <div class="srcopt ${S.source==='fs'?'cur':''}"><h4>${ic('folder')}Dữ liệu thật — thư mục Studio${S.source==='fs'?' <span class="pill pill-fs">Đang dùng</span>':''}</h4><p>Thư mục mặc định:</p><div class="path">${esc(DEFAULT_ROOT)}</div><p>Trình duyệt không tự mở được đường dẫn này. Bấm nút dưới rồi chọn đúng thư mục gốc (có <span class="mono">jobs/</span> và <span class="mono">assets/shops/</span>). Cần Chrome hoặc Edge, mở index.html trực tiếp từ ổ đĩa. Sau khi tải lại trang cần cấp quyền lại.</p>
      ${!fsOK?`<div class="note warn">${ic('alert')}<span>Trình duyệt hiện tại không hỗ trợ chọn thư mục (File System Access API). Dùng Demo hoặc Nhập JSON.</span></div>`:framed?`<div class="note warn">${ic('alert')}<span>Trang đang chạy trong khung nhúng — trình duyệt có thể chặn quyền chọn thư mục. Nếu bị chặn, mở index.html trực tiếp.</span></div>`:''}
      <div class="row"><button type="button" class="btn ${S.source==='fs'?'':'btn-pri'}" data-act="connect" ${fsOK?'':'disabled'}>${ic('folder')}${S.source==='fs'?'Chọn lại thư mục':'Chọn thư mục Studio'}</button></div></div>
    <div class="srcopt ${S.source==='demo'?'cur':''}"><h4>${ic('film')}Demo${S.source==='demo'?' <span class="pill pill-demo">Đang dùng</span>':''}</h4><p>Job minh họa đủ các tình huống. Thay đổi chỉ nằm trong bộ nhớ trang, không trộn vào dữ liệu thật.</p><div class="row"><button type="button" class="btn" data-act="use-demo">Dùng dữ liệu demo</button></div></div>
    <div class="srcopt ${S.source==='json'?'cur':''}"><h4>${ic('file')}JSON nhập thủ công${S.source==='json'?' <span class="pill pill-json">Đang dùng</span>':''}</h4><p>Nhập file JSON đã xuất từ giao diện này. Không tự ghi ngược vào Studio — chỉnh sửa được tải về bằng Xuất JSON. JSON không chứa video; khi xem có thể chọn file MP4 tương ứng.</p><div class="row"><button type="button" class="btn" data-act="import">${ic('upload')}Nhập JSON…</button><button type="button" class="btn" data-act="export-all">${ic('download')}Xuất JSON hiện tại</button></div></div>
  </div>
  <div class="form-grid">
    <label class="fld"><span>Người vận hành</span><input class="inp" name="operator" maxlength="80" value="${esc(S.operator)}" placeholder="Tên hiển thị khi xác nhận"><small>Tự điền khi xác nhận · lưu trong trình duyệt.</small></label>
    <label class="fld"><span>Chế độ mặc định</span><select class="inp" name="view">${opt(S.view,'grid','Lướt video')}${opt(S.view,'list','Danh sách')}</select></label>
    <label class="fld"><span>Đường dẫn Studio để hiển thị</span><input class="inp" name="root" maxlength="260" value="${esc(S.rootPath)}"><small>Chỉ để hiển thị/sao chép, không cấp quyền truy cập.</small></label>
    <label class="fld"><span>Số mục mỗi lần tải</span><select class="inp" name="page">${[12,24,48,96].map(n=>opt(S.pageSize,n,n)).join('')}</select></label>
    <label class="cbx fld full" style="flex-direction:row"><input type="checkbox" name="savefilters" ${S.defaultFilters?'checked':''}> Dùng bộ lọc hiện tại làm mặc định khi mở</label>
  </div>
  <div class="note ${S.source==='fs'?'info':''}">${ic('info')}<span>${S.source==='fs'?'Lưu thiết lập sẽ ghi dashboard.settings.json ở gốc Studio (không chứa API key).':'Đang ở chế độ '+(S.source==='demo'?'Demo':'JSON nhập')+': thiết lập chỉ lưu trong trình duyệt, không ghi vào Studio.'}</span></div>
  </div><div class="dlg-f"><button type="button" class="btn" data-act="dlg-close">Đóng</button><button class="btn btn-pri" type="submit">Lưu thiết lập</button></div></form>`,async fd=>{
    setOperator(String(fd.get('operator')).trim());S.view=fd.get('view')==='list'?'list':'grid';S.pageSize=+fd.get('page')||24;S.rootPath=String(fd.get('root')).trim()||DEFAULT_ROOT;
    S.defaultFilters=fd.get('savefilters')?{scope:S.scope,quick:S.quick,...S.f,q:'',sort:S.sort}:null;persistPrefs();
    if(S.source==='fs'){try{await S.adapter.writeSettings({schema_version:1,root_path:S.rootPath,default_view:S.view,page_size:S.pageSize,default_filters:S.defaultFilters,updated_at:nowIso()});toast('ok','Đã lưu dashboard.settings.json vào Studio.')}catch(e){toast('err','Lưu dashboard.settings.json thất bại: '+(ERRTXT[e.code]||e.message)+'. Tùy chọn vẫn áp dụng trong trình duyệt.');}}
    else toast('ok','Đã lưu thiết lập trong trình duyệt (không ghi vào Studio).');
    closeDlg();renderAll();
  },true);
}
function dlgReport(){
  const r=S.report,li=a=>a.length?`<ul class="blist">${a.map(x=>`<li><span class="nm mono" title="${esc(x.path)}">${esc(x.path)}</span><span class="rs">${esc(x.reason)}</span></li>`).join('')}</ul>`:'<p class="nx-none">Không có.</p>';
  dlgInfo('Báo cáo quét',`<p class="nx-none" style="margin:0">${S.source==='demo'?'Dữ liệu demo · ':''}Quét lúc ${fmtTime(S.scannedAt)} · đọc được ${S.jobs.length} jobs có meta.json.</p><div><b style="font-size:12.5px">Bỏ qua (${r.skipped.length})</b>${li(r.skipped)}</div><div><b style="font-size:12.5px">Lỗi đọc (${r.errors.length})</b>${li(r.errors)}</div><div class="note">${ic('info')}<span>Thư mục _delivery-*, _probe, _doctor không đưa vào thư viện để tránh final trùng. Job có JSON lỗi vẫn hiển thị kèm cảnh báo.</span></div>`);
}

/* sự kiện */
function onClick(ev){
  const el=ev.target.closest('[data-act]');
  if(!el){if(!ev.target.closest('#menu'))closeMenu();if(ev.target===$('#dlg'))closeDlg();if(ev.target.classList.contains('scrim'))$('#app').classList.remove('side-open');return}
  const act=el.dataset.act;if(act==='select'||act==='select-all')return;
  if(act!=='menu')closeMenu();
  const id=el.dataset.id||el.closest('[data-id]')?.dataset.id||(el.closest('#drawer')?S.drawerId:null),j=id?S.byId[id]:null;
  switch(act){
    case 'toggle-side':$('#app').classList.toggle('side-open');break;
    case 'collapse':S.collapsed=!S.collapsed;$('#app').classList.toggle('collapsed',S.collapsed);persistPrefs();renderSide();break;
    case 'nav':S.scope=el.dataset.scope;$('#app').classList.remove('side-open');afterFilter();break;
    case 'shopnav':S.f.shop=S.f.shop===el.dataset.shop?'':el.dataset.shop;$('#app').classList.remove('side-open');afterFilter();break;
    case 'stat':S.quick=S.quick===el.dataset.q?'':el.dataset.q;afterFilter();break;
    case 'view':S.view=el.dataset.v;persistPrefs();syncToolbar();renderList();break;
    case 'sort':{const k=el.dataset.k;S.sort=k==='name'?(S.sort==='name_asc'?'name_desc':'name_asc'):k==='updated'?(S.sort==='updated_desc'?'updated_asc':'updated_desc'):k;syncToolbar();renderList();break}
    case 'chip-x':{const k=el.dataset.k;if(k==='quick')S.quick='';else{S.f[k]='';if(k==='q')$('#q').value=''}afterFilter();break}
    case 'clear':S.quick='';Object.keys(S.f).forEach(k=>S.f[k]='');$('#q').value='';afterFilter();break;
    case 'more':S.shown+=S.pageSize;renderList();break;
    case 'open':if(j){closeDlg();openDrawer(j.id,el.dataset.w)}break;
    case 'open-preview':openDrawer(id,'preview');break;
    case 'inline':playInline(id);break;
    case 'inline-stop':stopInline();break;
    case 'pick':S.pickFor={id:id||S.drawerId,which:el.dataset.w,ctx:el.closest('#drawer')?'drawer':'inline'};$('#pickMp4').value='';$('#pickMp4').click();break;
    case 'retry-media':if(el.closest('#drawer')){releaseMedia(S.drawerId+':'+S.drWhich);renderPlayer()}else if(id){releaseMedia(id+':'+(S.byId[id].ev.hasFinal?'final':'preview'));S.inline=null;playInline(id)}break;
    case 'use':if(j)onUse(j.id,el.dataset.ch);break;
    case 'menu':ev.stopPropagation();if(!$('#menu').hidden&&S.menuBtn===el)closeMenu();else openMenu(el,id);break;
    case 'grab':grabFrame(j);break;
    case 'copy-final':copyText(winPath(j.dir,'final.mp4'),'đường dẫn final');break;
    case 'copy-dir':copyText(winPath(j.dir),'đường dẫn thư mục');break;
    case 'copy':copyText(el.dataset.path,'đường dẫn');break;
    case 'close-job':if(el.getAttribute('aria-disabled')==='true'||j)dlgClose(j);break;
    case 'reopen':dlgReopen(j);break;
    case 'archive':case 'unarchive':dlgArchive(j);break;
    case 'rescan':if(S.adapter)loadFrom(S.adapter);break;
    case 'settings':dlgSettings();break;
    case 'report':dlgReport();break;
    case 'connect':connectFs();break;
    case 'use-demo':closeDlg();S.jsonDirty=0;loadFrom(new MemAdapter('demo',demoData()));break;
    case 'import':$('#pickJson').value='';$('#pickJson').click();break;
    case 'export-all':exportJobs(S.jobs);break;
    case 'bulk':dlgBulk(el.dataset.k);break;
    case 'bulk-export':exportJobs([...S.selected].map(i=>S.byId[i]).filter(Boolean));break;
    case 'bulk-clear':S.selected.clear();$$('[data-sel]').forEach(c=>{c.checked=false;c.closest('.card,tr')?.classList.remove('sel')});renderBulk();syncSelAll();break;
    case 'dr-close':closeDrawer();break;
    case 'dlg-close':closeDlg();break;
    case 'ptab':S.drWhich=el.dataset.w;renderPlayer();break;
    case 'hash':ensureHash(j).then(()=>{refreshJob(j.id);toast('ok','SHA-256 final: '+short(j.finalSha)+'…')}).catch(e=>toast('err','Không tính được SHA-256: '+e.message));break;
    case 'review':startReview(j,el.dataset.k);break;
    case 'evidence':viewEvidence(j,el.dataset.file);break;
    case 'retry':persist(j);break;
    case 'draft':exportDraft(j);break;
    case 'discard':discardDraft(j);break;
    case 'reload-mgmt':closeDlg();reloadMgmt(j);break;
  }
}
function onChange(ev){
  const t=ev.target;
  if(t.matches('[data-sel]')){const id=t.dataset.sel;t.checked?S.selected.add(id):S.selected.delete(id);(t.closest('.card')||t.closest('tr'))?.classList.toggle('sel',t.checked);renderBulk();syncSelAll();return}
  if(t.matches('[data-act="select-all"]')){const all=S.lastVisible||[];if(t.checked)all.forEach(j=>S.selected.add(j.id));else all.forEach(j=>S.selected.delete(j.id));$$('[data-sel]').forEach(c=>{c.checked=S.selected.has(c.dataset.sel);c.closest('.card,tr')?.classList.toggle('sel',c.checked)});renderBulk();syncSelAll();return}
  if(t.matches('select[data-f]')){S.f[t.dataset.f]=t.value;afterFilter();return}
  if(t.id==='sort'){S.sort=t.value;renderList();return}
  if(t.id==='pickMp4'&&t.files[0]){const p=S.pickFor,j=p&&S.byId[p.id];if(!j||!S.adapter.attachMedia)return;S.adapter.attachMedia(j,p.which,t.files[0]);releaseMedia(j.id+':'+p.which);if(p.which==='final'&&S.source==='json'){j.finalSha=null}
    toast('info',`Đã chọn “${t.files[0].name}” để xem thử (chỉ trong phiên này${S.source==='demo'?', không phải final thật':''}).`);if(p.ctx==='drawer'&&S.drawerId===j.id){S.drWhich=p.which;renderPlayer()}else{S.inline=null;playInline(j.id)}return}
  if(t.id==='pickJson'&&t.files[0]){importJson(t.files[0]);return}
}
let qTimer;
function onInput(ev){if(ev.target.id==='q'){clearTimeout(qTimer);qTimer=setTimeout(()=>{S.f.q=ev.target.value;afterFilter()},140)}}
function onKey(ev){
  const m=$('#menu');
  if(!m.hidden){if(ev.key==='Escape'){ev.preventDefault();closeMenu(true);return}if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();const it=$$('.mi',m),i=it.indexOf(document.activeElement);it[(i+(ev.key==='ArrowDown'?1:-1)+it.length)%it.length].focus();return}if(ev.key==='Tab')closeMenu()}
  if(ev.key==='/'&&!ev.target.closest('input,textarea,select,[contenteditable]')&&!document.querySelector('dialog[open]')){ev.preventDefault();$('#q')?.focus()}
}
function onSubmit(ev){
  const f=ev.target;ev.preventDefault();
  if(f.id==='infoForm'){const j=cur();if(!j)return;const fd=new FormData(f),dn=String(fd.get('display_name')).trim(),kind=fd.get('kind')||null,note=String(fd.get('note'));const m0=effMgmt(j);
    if((m0.display_name||'')===dn&&(m0.kind||null)===kind&&(m0.note||'')===note)return toast('info','Không có thay đổi.');
    mutate(j,m=>{m.display_name=dn||null;m.kind=kind;m.note=note;m.history.push({at:nowIso(),by:S.operator||'Không rõ',action:'edit_info'})},{msg:'Đã lưu thông tin'});return}
  const d=$('#dlg');if(!d.contains(f))return;const h=d._h;if(!h)return closeDlg();
  const btns=$$('.dlg-f button',d);btns.forEach(b=>b.disabled=true);
  Promise.resolve(h(new FormData(f),ev.submitter)).then(keep=>{if(keep&&d.open)btns.forEach(b=>{if(b.isConnected)b.disabled=false})}).catch(e=>{toast('err',e.message);btns.forEach(b=>b.disabled=false)});
}
function init(){
  const p=loadPrefs();S.view=p.view==='list'?'list':'grid';S.pageSize=+p.pageSize||24;S.shown=S.pageSize;S.collapsed=!!p.collapsed;S.defaultFilters=p.filters||null;if(p.rootPath)S.rootPath=p.rootPath;applyFilters(S.defaultFilters);
  try{S.operator=localStorage.getItem(LS.operator)||''}catch{}
  $('#app').classList.toggle('collapsed',S.collapsed);
  document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('keydown',onKey);document.addEventListener('submit',onSubmit);
  document.addEventListener('play',e=>{$$('video').forEach(v=>{if(v!==e.target&&!v.paused)v.pause()})},true);
  const dr=$('#drawer');dr.addEventListener('close',()=>{dr.querySelectorAll('video').forEach(v=>v.pause());dr.innerHTML='';S.drawerId=null;releaseUnused();S.lastFocus?.isConnected&&S.lastFocus.focus()});
  dr.addEventListener('click',e=>{if(e.target===dr)closeDrawer()});
  const dl=$('#dlg');dl.addEventListener('close',()=>{dl.innerHTML='';dl._h=null;if(S.evUrl){URL.revokeObjectURL(S.evUrl);S.evUrl=null}S.dlgFocus?.isConnected&&S.dlgFocus.focus()});
  addEventListener('scroll',()=>$('#toolbar').classList.toggle('stuck',scrollY>120),{passive:true});
  addEventListener('resize',()=>closeMenu());
  renderAll();loadFrom(new MemAdapter('demo',demoData()),{silent:true});
}
init();


</script>
