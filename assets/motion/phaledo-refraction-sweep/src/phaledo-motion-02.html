<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>PHALEDO Motion 02 — Refraction Sweep (render)</title>
<!-- Transparent overlay 1080×1920, 3.2 s, 30 fps. No CDN.
     Wordmark + ® = original artwork (assets/phaledo-word.png, assets/phaledo-reg.png, 1000×1000 artboard);
     an SVG on the same artboard can be swapped in with ?word=…svg&reg=…svg.
     Optics are simulated only inside the letters and in the light band (RGBA pixels). Footage below is never distorted.
     All light = same-RGB gradients fading to alpha 0, normal blend. -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { display: block; background: transparent; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1C1A18"/><path d="M52 24 L44 76" stroke="#E9DDC9" stroke-width="5" opacity="0.35"/><path d="M52 24 L44 76" stroke="#FFF9F0" stroke-width="1"/><text x="50" y="54" text-anchor="middle" font-size="10" fill="#F2E9E3" font-family="sans-serif" letter-spacing="1">PHALEDO</text></svg></template>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
(function () {
  const DURATION = 3.2, FPS = 30, W = 1080, H = 1920, TAU = Math.PI * 2;
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) && q.get(k) !== '' && !isNaN(+q.get(k)) ? +q.get(k) : d);
  const ANCHORS = { center: 0.5, upper: 0.33, lower: 0.66 };
  const variant = (v) => (v === 'light' || v === 'charcoal' ? 'light' : 'dark');
  const opts = {
    anchor: ANCHORS[q.get('anchor')] != null ? q.get('anchor') : 'center',
    nx: q.has('nx') ? num('nx', 0.5) : null, ny: q.has('ny') ? num('ny', 0.5) : null,
    scale: num('scale', 1),                                   // 1 = P→O spans 50% of frame width
    lightDirection: q.get('lightDirection') === 'rtl' ? 'rtl' : 'ltr',
    colorVariant: variant(q.get('colorVariant')),             // light = charcoal logo (light footage) · dark = ivory logo (dark footage)
  };
  const ART = {
    word: { src: q.get('word') || 'assets/phaledo-word.png', box: [72, 435, 900, 565] },
    reg: { src: q.get('reg') || 'assets/phaledo-reg.png', box: [877, 374, 940, 437] },
  };
  const ORIGIN = [486, 500], LETTERS_W = 828, LETTER_TOP = 435, LETTER_BOT = 565;
  const STEMS = [170, 661];   // left edges of H and D stems (artboard x)
  const TONES = {
    dark: { ink: null, sheen: [255, 251, 245], band: [236, 224, 204], rimD: [24, 21, 18], rimDA: 0.22, fillA: 0.07 },
    light: { ink: '#1C1A18', sheen: [255, 255, 255], band: [200, 181, 152], rimD: [28, 25, 22], rimDA: 0.5, fillA: 0.14 },
  };

  const c01 = (v) => Math.max(0, Math.min(1, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const tw = (T, a, b) => c01((T - a) / (b - a));
  const E = {
    io: (t, k = 3) => (t < 0.5 ? Math.pow(2 * t, k) / 2 : 1 - Math.pow(2 - 2 * t, k) / 2),
    out: (t, k = 3) => 1 - Math.pow(1 - t, k),
    bump: (t) => (t <= 0 || t >= 1 ? 0 : Math.sin(Math.PI * t)),
  };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a)).toFixed(4)})`;

  const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
  const imgs = {};
  let L = null, cur = num('t', 0), auto = q.get('render') !== '1', ready = false;

  const mk = () => { const c = document.createElement('canvas'); c.width = L.wa.w; c.height = L.wa.h; return c; };
  function tint(src, color, a = 1) {
    const c = mk(), g = c.getContext('2d');
    g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in';
    g.fillStyle = typeof color === 'string' ? color : rgba(color, a); g.fillRect(0, 0, c.width, c.height);
    return c;
  }
  function rim(src, color, dx, dy) {
    const c = tint(src, color), g = c.getContext('2d');
    g.globalCompositeOperation = 'destination-out'; g.drawImage(src, dx, dy);
    return c;
  }
  function placeArt(img, box) {
    const c = mk(), g = c.getContext('2d'), s = L.s, pad = 3;
    const sx = box[0] - pad, sy = box[1] - pad, sw = box[2] - box[0] + pad * 2, sh = box[3] - box[1] + pad * 2;
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(img, sx, sy, sw, sh, Math.round(L.ox + (sx - ORIGIN[0]) * s), Math.round(L.oy + (sy - ORIGIN[1]) * s), sw * s, sh * s);
    return c;
  }
  function makeGlass(shape) {
    const t = L.tone, d = 1.6 * L.k, c = mk(), g = c.getContext('2d');
    g.globalAlpha = t.fillA; g.drawImage(tint(shape, t.sheen), 0, 0);
    g.globalAlpha = 0.9; g.drawImage(rim(shape, t.sheen, d, d), 0, 0);
    g.globalAlpha = 0.25; g.drawImage(rim(shape, t.sheen, d * 2.4, d * 2.4), 0, 0);
    g.globalAlpha = t.rimDA; g.drawImage(rim(shape, t.rimD, -d, -d), 0, 0);
    return c;
  }

  function layout() {
    const s = (0.5 * opts.scale * W) / LETTERS_W;
    const cx = (opts.nx != null ? opts.nx : 0.5) * W, cy = (opts.ny != null ? opts.ny : ANCHORS[opts.anchor]) * H;
    const half = (LETTERS_W * s) / 2, lh = (LETTER_BOT - LETTER_TOP) * s;
    const wa = { x0: Math.round(cx - half - 220), y0: Math.round(cy - lh * 2.3), w: Math.round(half * 2 + 440), h: Math.round(lh * 4.6) };
    L = { s, k: s / 0.326, cx, cy, half, lh, wa, ox: cx - wa.x0, oy: cy - wa.y0, tone: TONES[opts.colorVariant], dir: opts.lightDirection === 'rtl' ? -1 : 1 };
    L.k = Math.max(0.6, (LETTERS_W * s) / 540);   // 1 at default size
    const word = placeArt(imgs.word, ART.word.box), reg = placeArt(imgs.reg, ART.reg.box);
    L.wordShape = word; L.regShape = reg;
    L.wordSolid = L.tone.ink ? tint(word, L.tone.ink) : word;
    L.regSolid = L.tone.ink ? tint(reg, L.tone.ink) : reg;
    L.wordGlass = makeGlass(word); L.regGlass = makeGlass(reg);
    L.rimMask = rim(word, [255, 255, 255], 1.6 * L.k, 1.6 * L.k);
    L.A = mk(); L.B = mk(); L.C = mk();
    L.left = L.ox - half; L.width = half * 2;
  }

  // ---- Timeline (s)
  // 0–0.45 faint hairline band · 0.45–1.45 band sweeps, letters: glass → solid · 1.45–1.9 highlight runs down two stems
  // 1.9–2.5 hold, ® reveal · 2.5–3.15 light leaves the surface (solid → glass → gone)
  const SKEW = 0.21;
  const ux = (u) => (L.dir > 0 ? L.left + u * L.width : L.left + L.width - u * L.width);   // progress (0–1 across P→O) → WA x
  const bandU = (T) => lerp(-0.2, 1.18, E.io(tw(T, 0.1, 1.6), 2.4));
  const skew = (g) => { const K = -L.dir * SKEW; g.setTransform(1, 0, K, 1, -K * L.oy, 0); };

  function mask(g, front, feather, keepBehind, a = 1) {
    g.save(); g.globalCompositeOperation = 'destination-in'; skew(g);
    const gr = g.createLinearGradient(front - L.dir * feather, 0, front, 0);
    gr.addColorStop(0, `rgba(0,0,0,${keepBehind ? a : 0})`); gr.addColorStop(1, `rgba(0,0,0,${keepBehind ? 0 : a})`);
    g.fillStyle = gr; g.fillRect(-W, 0, L.wa.w + W * 2, L.wa.h); g.restore();
  }
  function band(g, x, inten, wMul, color) {
    g.save(); skew(g);
    const soft = 58 * L.k * wMul;
    const gr = g.createLinearGradient(x - soft, 0, x + soft, 0);
    [[0, 0], [0.3, 0.06], [0.44, 0.22], [0.5, 0.5], [0.56, 0.22], [0.7, 0.06], [1, 0]].forEach(([o, a]) => gr.addColorStop(o, rgba(color, a * inten)));
    g.fillStyle = gr; g.fillRect(x - soft, -L.wa.h, soft * 2, L.wa.h * 3); g.restore();
  }
  const clear = (c) => { const g = c.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.clearRect(0, 0, c.width, c.height); return g; };

  function drawLight(x, inten, wMul) {
    if (inten <= 0.002) return;
    const t = L.tone;
    // outside the letters: champagne band, soft vertical falloff, cut where the glass letters are
    let g = clear(L.C);
    band(g, x, inten, wMul, t.band);
    const vg = g.createLinearGradient(0, 0, 0, L.wa.h);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(0.32, 'rgba(0,0,0,1)'); vg.addColorStop(0.68, 'rgba(0,0,0,1)'); vg.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalCompositeOperation = 'destination-in'; g.fillStyle = vg; g.fillRect(0, 0, L.wa.w, L.wa.h);
    g.globalCompositeOperation = 'destination-out'; g.drawImage(L.wordShape, 0, 0); g.drawImage(L.regShape, 0, 0);
    ctx.drawImage(L.C, L.wa.x0, L.wa.y0);
    // inside the letters: refracted — shifted forward, narrower, brighter
    g = clear(L.C);
    band(g, x + L.dir * 9 * L.k, Math.min(1, inten * 1.5), wMul * 0.6, t.sheen);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(L.wordShape, 0, 0);
    ctx.globalAlpha = 0.9; ctx.drawImage(L.C, L.wa.x0, L.wa.y0); ctx.globalAlpha = 1;
  }

  function draw(T) {
    cur = T;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
    if (!ready) return;
    const G = 1 - E.io(tw(T, 2.98, 3.15));
    if (G <= 0) return;
    ctx.globalAlpha = 1;
    const bx = ux(bandU(T)), Wd = L.width;
    const regGlassA = E.bump(tw(T, 1.92, 2.42)), regSolidA = E.io(tw(T, 2.02, 2.4));
    const exitU = lerp(-0.3, 1.3, E.io(tw(T, 2.5, 3.05), 2));
    const inExit = T >= 2.5;

    // glass letters — revealed just behind the band; in the outro they linger behind the leaving light
    let g = clear(L.A);
    g.drawImage(L.wordGlass, 0, 0);
    if (regGlassA > 0) { g.globalAlpha = regGlassA; g.drawImage(L.regGlass, 0, 0); g.globalAlpha = 1; }
    if (!inExit) mask(g, bx, 46 * L.k, true);
    else mask(g, ux(exitU - 0.22), Wd * 0.3, false);
    const glassA = (inExit ? 1 - E.io(tw(T, 2.8, 3.12)) : 1) * G;
    ctx.globalAlpha = glassA; ctx.drawImage(L.A, L.wa.x0, L.wa.y0);

    // solid artwork — follows the band with a lag; fully settled by 1.5 s
    g = clear(L.B);
    g.drawImage(L.wordSolid, 0, 0);
    if (regSolidA > 0) { g.globalAlpha = regSolidA; g.drawImage(L.regSolid, 0, 0); g.globalAlpha = 1; }
    const settle = E.io(tw(T, 1.28, 1.52));
    if (!inExit && settle < 1) {
      const ms = clear(L.C); ms.drawImage(L.B, 0, 0);
      mask(ms, bx - L.dir * Wd * 0.17, Wd * 0.2, true);
      g.globalCompositeOperation = 'destination-in'; g.globalAlpha = settle; g.fillStyle = '#000'; g.fillRect(0, 0, L.wa.w, L.wa.h);
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.drawImage(L.C, 0, 0);
    }
    if (inExit) mask(g, ux(exitU), Wd * 0.3, false);
    ctx.globalAlpha = G; ctx.drawImage(L.B, L.wa.x0, L.wa.y0); ctx.globalAlpha = 1;

    // highlight running along two stem edges
    const order = L.dir > 0 ? STEMS : [...STEMS].reverse();
    [[1.45, 1.76, 0], [1.6, 1.9, 1]].forEach(([a, b, i]) => {
      const p = tw(T, a, b); if (p <= 0 || p >= 1) return;
      const down = i === 0, sx = L.ox + (order[i] - ORIGIN[0]) * L.s;
      const sy = L.oy + (LETTER_TOP - ORIGIN[1]) * L.s + L.lh * (down ? E.io(p, 2) : 1 - E.io(p, 2));
      const hg = clear(L.C), r = L.lh * 0.34;
      hg.save(); hg.translate(sx, sy); hg.scale(0.22, 1);
      const rg = hg.createRadialGradient(0, 0, 0, 0, 0, r);
      rg.addColorStop(0, rgba(L.tone.sheen, 1)); rg.addColorStop(1, rgba(L.tone.sheen, 0));
      hg.fillStyle = rg; hg.beginPath(); hg.arc(0, 0, r, 0, TAU); hg.fill(); hg.restore();
      hg.globalCompositeOperation = 'destination-in'; hg.drawImage(L.rimMask, 0, 0);
      ctx.globalAlpha = 0.95 * E.bump(p) * G; ctx.drawImage(L.C, L.wa.x0, L.wa.y0); ctx.globalAlpha = 1;
    });

    // the light band
    const bandI = lerp(0.3 * E.io(tw(T, 0, 0.45)), 0.72, E.io(tw(T, 0.35, 0.75))) * (1 - E.io(tw(T, 1.4, 1.72)));
    const bandWm = lerp(0.3, 1, E.io(tw(T, 0.25, 0.75)));
    drawLight(bx, bandI * G, bandWm);
    if (inExit) drawLight(ux(exitU), 0.42 * E.bump(tw(T, 2.5, 3.08)) * G, 1.3);
    ctx.globalAlpha = 1;
  }

  const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()).then(() => res(i)); i.onerror = () => rej(new Error('Không tải được ' + src)); i.src = src; });
  const readyP = Promise.all(Object.entries(ART).map(([k, a]) => load(a.src).then((i) => { imgs[k] = i; }))).then(() => { ready = true; layout(); draw(cur); });

  function setTime(t) { auto = false; draw(Math.max(0, Math.min(DURATION, +t || 0))); }
  function configure(o) {
    o = Object.assign({}, o || {});
    if (o.colorVariant) o.colorVariant = variant(o.colorVariant);
    if (o.anchor && ANCHORS[o.anchor] == null) delete o.anchor;
    if (o.anchor && !('ny' in o)) { o.nx = null; o.ny = null; }
    Object.assign(opts, o);
    if (ready) { layout(); draw(cur); }
  }

  window.setTime = setTime;
  window.PHALEDO_MOTION = { ready: readyP, duration: DURATION, fps: FPS, width: W, height: H, setTime, configure, opts, get time() { return cur; } };
  window.GDP_MOTION = window.PHALEDO_MOTION;

  let clock = cur, last = performance.now();
  const loop = (now) => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (auto) { clock += dt; if (clock > DURATION + 0.6) clock = 0; draw(Math.min(DURATION, clock)); requestAnimationFrame(loop); }
  };
  readyP.then(() => { if (auto) requestAnimationFrame((n) => { last = n; loop(n); }); });
})();
</script>
</body>
</html>
