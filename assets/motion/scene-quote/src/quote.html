<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Quote</title>
<!-- Scene Library · C11 Quote / Insight v1.0 (Claude viết 06/11/2026) — assets/scenes/quote/scene.json.
     Câu nói quan trọng thành MỘT THẺ RIÊNG: ngoặc kép to, chữ hiện từng từ, *cụm khoá* nổi màu + gạch chân tự vẽ,
     người nói / nguồn bên dưới. standard = thẻ phủ khung; full = thẻ + ảnh (người nói / bối cảnh); micro = thẻ gọn đè
     footage ở vùng phụ đề (chữ động tạm nhường).
     Hợp đồng Motion Engine: window.setTime(giây) vẽ ĐỒNG BỘ, không Internet, KHÔNG will-change.
     Query: theme · preset · dur · quote (`*cụm khoá*`) · by · eyebrow · photo · y (micro) · bg · seed. -->
<style>
  @font-face { font-family: "GdpBold"; src: url("fonts/UTM_AvoBold.ttf"); }
  @font-face { font-family: "GdpReg"; src: url("fonts/UTM_Avo.ttf"); }
  @font-face { font-family: "PhBold"; src: url("fonts/Averta-Bold.otf"); }
  @font-face { font-family: "PhReg"; src: url("fonts/Averta-Regular.otf"); }
  @font-face { font-family: "PhLight"; src: url("fonts/Averta-Light.otf"); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; white-space: nowrap; box-sizing: border-box; }
  .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  .bgimg { background-size: 100% 100%; background-repeat: no-repeat; }
  .q { position: absolute; left: 0; top: 0; box-sizing: border-box; white-space: normal; line-height: 1.24; }
  .w { display: inline-block; position: relative; z-index: 0; padding: .06em 0 .04em; margin: -.06em 0 -.04em; }
  .mk { position: absolute; left: -.05em; right: -.05em; z-index: -1; transform-origin: 0 50%; }
</style>
<script src="assets.js"></script>
<script src="themes.js"></script>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script>
(function () {
  const W = 1080, H = 1920, FPS = 30;
  const Q = new URLSearchParams(location.search);
  const TH_ID = Q.get("theme") || "gdp_red";
  const T = window.SCENE_THEMES[TH_ID] || window.SCENE_THEMES.gdp_red;
  const C = T.color, A = window.KIT_ASSETS, E = T.engine;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const prog = (t, a, b) => b <= a ? (t >= b ? 1 : 0) : clamp((t - a) / (b - a));
  const outBack = (x, s = 1.5) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const inCubic = x => x * x * x;
  const inOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const stop12 = t => Math.floor(t * 12 + 1e-6) / 12;
  const SEED = parseInt(Q.get("seed") || "1", 10) || 1;
  function rng(n) { let a = (SEED * 7919 + n * 104729) >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  const PRESETS = { micro: { min: 1.2, def: 2.5 }, standard: { min: 1.8, def: 3.5 }, full: { min: 3.0, def: 5 } };
  const PRESET = PRESETS[Q.get("preset")] ? Q.get("preset") : "standard";
  const D = Math.max(PRESETS[PRESET].min, parseFloat(Q.get("dur") || PRESETS[PRESET].def) || PRESETS[PRESET].def);
  const MICRO = PRESET === "micro", FULL = PRESET === "full";
  const QUOTE = (Q.get("quote") || "").trim(), BY = (Q.get("by") || "").trim(), EYEBROW = MICRO ? "" : (Q.get("eyebrow") || "").trim();
  const photoSrc = p => !p || p === "none" ? null : p.startsWith("file:") ? p : (A[p] ? A[p].src : null);
  const PHOTO = FULL ? photoSrc(Q.get("photo")) : null;
  const BGK = (T.bg || {})[Q.get("bg") || "default"] || (T.bg || {}).default;
  const DE = D - 1 / FPS, EX = MICRO ? 0.25 : 0.35, HIN = MICRO ? 0.25 : 0.45;
  const QA = { theme: TH_ID, preset: PRESET, dur: D, overflow: [], warn: [], fontPx: {} };
  if (!QUOTE) QA.overflow.push("thiếu quote");
  if (FULL && Q.get("photo") && !PHOTO) QA.warn.push("không tìm thấy ảnh " + Q.get("photo"));

  // câu → từ; *cụm khoá* → key; dấu câu dính liền sau cụm khoá ghép vào từ trước
  const WORDS = [];
  QUOTE.split(/(\*[^*]+\*)/).forEach(seg => {
    if (!seg) return;
    const key = /^\*[^*]+\*$/.test(seg), s = key ? seg.slice(1, -1) : seg;
    const toks = s.split(/\s+/).filter(Boolean);
    if (!key && toks.length && !/^\s/.test(s) && WORDS.length) { WORDS[WORDS.length - 1].tail = toks.shift(); }
    toks.forEach(w => WORDS.push({ w, key, tail: "" }));
  });
  const NW = WORDS.length;
  // nhịp hiện chữ: bắt đầu khi thẻ chạm, xong sớm (≤ 45% thời gian còn lại) để còn đứng đọc
  const RV0 = HIN * 0.8, RV1 = RV0 + Math.min(NW * 0.075, Math.max(0.3, (DE - EX - RV0) * 0.45)), PER = NW ? (RV1 - RV0) / NW : 0;
  const BY_T = RV1 + 0.1;

  const root = document.getElementById("root");
  const imgs = [];
  function node(tag, cls, parent) { const e = document.createElement(tag); if (cls) e.className = cls; (parent || root).appendChild(e); return e; }
  function bgi(el, key, size) { const a = A[key]; const im = new Image(); im.src = a.src; imgs.push(im); el.style.backgroundImage = `url(${a.src})`; el.classList.add("bgimg");
    if (size) el.style.backgroundSize = size; return el; }
  function image(src, parent, cls) { const im = node("img", cls || "", parent); im.src = src; imgs.push(im); return im; }
  function asset(key, w, parent) { const a = A[key], im = image(a.src, parent, "abs"); im.style.width = w + "px"; im.style.height = (w * a.h / a.w) + "px"; return im; }
  function place(el, x, y) { el.style.left = Math.round(x) + "px"; el.style.top = Math.round(y) + "px"; }
  function size(el, w, h) { el.style.width = Math.round(w) + "px"; el.style.height = Math.round(h) + "px"; }
  function rect(el) { const r = el.getBoundingClientRect(); return { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) }; }

  // nền (phủ khung)
  let bg = null, vig = null, light = null, page = null, washi = null, branch = null;
  if (!MICRO) {
    bg = image(A[BGK].src, root, "full");
    vig = node("div", "full"); vig.style.background = E === "glass" ? "radial-gradient(ellipse 80% 60% at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,.62) 100%)"
      : E === "journal" ? "radial-gradient(ellipse 85% 70% at 50% 45%, rgba(0,0,0,0) 45%, rgba(70,45,20,.28) 100%)" : "radial-gradient(ellipse 80% 70% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.38) 100%)";
    if (E === "glass") { light = image(A[T.light].src, root, "full"); light.style.mixBlendMode = "screen"; }
    if (E === "journal") { page = asset(T.page, 900); page.style.filter = "drop-shadow(0 14px 18px rgba(60,40,20,.3))"; }
  }
  // ảnh (full)
  let pf = null, pimg = null, ptape = null;
  if (PHOTO) {
    pf = node("div", "abs"); pimg = image(PHOTO, pf, "abs"); pimg.style.objectFit = "cover";
    if (E === "paper") Object.assign(pf.style, { background: "#f7f3ea", filter: "drop-shadow(0 10px 12px rgba(0,0,0,.4))" });
    else if (E === "glass") Object.assign(pf.style, { border: "1px solid rgba(184,154,106,.55)", padding: "0" });
    else Object.assign(pf.style, { background: "#fffaf0", filter: "drop-shadow(0 8px 12px rgba(60,40,20,.28))" });
    if (E === "glass") pimg.style.filter = "brightness(.88) contrast(1.04)";
    if (E === "paper") ptape = asset(T.tape, 230);
  }
  // thẻ: sh (bóng + nền, có thể cắt mép) · chữ đặt trong thẻ, không bóng
  const card = node("div", "abs"); card.style.whiteSpace = "normal";
  const sh = node("div", "abs", card), cbg = node("div", "abs", sh);
  if (MICRO) {
    if (E === "paper") { bgi(cbg, T.card, "1400px auto"); cbg.style.backgroundPosition = "50% 40%"; sh.style.filter = "drop-shadow(0 8px 10px rgba(0,0,0,.42))"; }
    else if (E === "glass") Object.assign(cbg.style, { background: C.panel, border: "1px solid rgba(184,154,106,.55)", borderRadius: "6px" });
    else { Object.assign(cbg.style, { background: C.panel, borderRadius: "4px" }); sh.style.filter = "drop-shadow(0 8px 12px rgba(50,28,12,.3))"; }
  } else if (E === "paper") { bgi(cbg, T.card); sh.style.filter = "drop-shadow(0 16px 18px rgba(0,0,0,.45))"; }
  let tape = null;
  if (E === "paper" && !MICRO) tape = asset(T.tape, 340, card);
  if (E === "journal" && !MICRO) { washi = asset(T.washi, 380); branch = asset(T.branch, 210); }
  if (E === "journal" && MICRO) tape = asset(T.washi, 200, card);
  const qm = node("div", "abs", card); qm.textContent = "“";
  Object.assign(qm.style, { fontFamily: T.fonts.mark, color: C.mark, fontSize: (MICRO ? T.px.markMicro : T.px.mark) + "px", lineHeight: "1" });
  const txt = node("div", "q", card);
  Object.assign(txt.style, { fontFamily: T.fonts.quote, color: C.quote });
  const spans = WORDS.map((o, i) => {
    if (i) txt.appendChild(document.createTextNode(" "));
    const s = node("span", "w", txt); s.textContent = o.w + o.tail;
    if (o.key) { s.style.fontFamily = T.fonts.key; s.style.color = C.key;
      const m = node("div", "mk", s);
      if (E === "journal") { bgi(m, T.under); Object.assign(m.style, { height: ".24em", bottom: "-.1em" }); }
      else Object.assign(m.style, { height: E === "glass" ? "2px" : ".12em", bottom: E === "glass" ? ".02em" : ".04em", background: C.under, opacity: E === "paper" ? ".9" : "1" });
      o.mk = m; }
    return s;
  });
  let byEl = null, rule = null, eb = null;
  if (BY) { byEl = node("div", "abs", card); byEl.textContent = E === "glass" ? "—  " + BY.toLocaleUpperCase("vi") : E === "journal" ? "— " + BY : BY;
    Object.assign(byEl.style, { fontFamily: T.fonts.by, color: C.by, fontSize: (MICRO ? Math.round(T.px.by * 0.8) : T.px.by) + "px", letterSpacing: E === "glass" ? ".2em" : "0" });
    if (E === "paper") { bgi(byEl, T.byTape); Object.assign(byEl.style, { padding: MICRO ? "8px 30px 10px 26px" : "14px 46px 16px 40px" }); }
    if (E === "glass") { rule = node("div", "abs", card); Object.assign(rule.style, { height: "1px", width: "110px", background: C.line, transformOrigin: "0 50%" }); } }
  if (EYEBROW) { eb = node("div", "abs", card); eb.textContent = E === "journal" ? EYEBROW : EYEBROW.toLocaleUpperCase("vi");
    Object.assign(eb.style, { fontFamily: T.fonts.eyebrow, color: C.eyebrow, fontSize: T.px.eyebrow + "px", letterSpacing: E === "glass" ? ".3em" : E === "paper" ? ".06em" : "0" });
    if (E === "paper") Object.assign(eb.style, { background: C.eyebrowBg, padding: "10px 22px 9px" }); }

  function fitText(px, maxW, maxLines, maxH) {
    txt.style.width = maxW + "px"; let k = 1, fs = px, lines = 0;
    for (;;) {
      fs = Math.round(px * k); txt.style.fontSize = fs + "px";
      lines = Math.round(txt.offsetHeight / (fs * 1.24));
      const wide = Math.max(0, ...spans.map(s => s.offsetWidth)) > maxW + 1;
      if ((lines <= maxLines && txt.offsetHeight <= maxH && !wide) || k <= 0.5) break;
      k -= 0.04;
    }
    QA.fontPx.quote = fs; QA.lines = lines;
    if (lines > maxLines || txt.offsetHeight > maxH) QA.overflow.push(`câu dài: thu chữ còn ${fs}px vẫn ${lines} dòng — rút gọn quote`);
    else if (k < 0.75) QA.warn.push(`câu dài: chữ thu còn ${fs}px (${Math.round(k * 100)}%)`);
    // vạch nhấn liền mạch giữa các từ khoá cùng dòng
    WORDS.forEach((o, i) => { if (!o.mk) return; const nx = WORDS[i + 1], a = spans[i], b = spans[i + 1];
      o.mk.style.right = nx && nx.key && b.offsetTop === a.offsetTop ? `${-(b.offsetLeft - a.offsetLeft - a.offsetWidth) - 2}px` : "-.05em"; });
  }

  function layout() {
    let cx, cy, cw, ch;
    if (MICRO) {
      cw = 900; const pad = E === "paper" ? 40 : 34, tl = pad + (E === "glass" ? 70 : 54);
      fitText(T.px.micro, cw - tl - pad, 3, 3 * T.px.micro * 1.3);
      const byH = byEl ? byEl.offsetHeight : 0;
      ch = pad + txt.offsetHeight + (byEl ? byH + (E === "paper" ? 6 : 12) : 0) + pad;
      place(txt, tl, pad); place(qm, E === "glass" ? pad - 6 : 12, E === "glass" ? pad - 10 : -28);
      if (byEl) place(byEl, cw - byEl.offsetWidth - (E === "paper" ? 18 : pad), pad + txt.offsetHeight + (E === "paper" ? 0 : 10));
      if (tape) { place(tape, -40, -26); tape.style.transform = "rotate(-6deg)"; }
      const yc = clamp(parseFloat(Q.get("y")) || 0.66, 0.2, 0.8) * H;
      cx = 90; cy = clamp(yc - ch / 2, 0.1 * H, 0.82 * H - ch);
      if (E === "paper") {   // mép giấy xé trên / dưới
        const r = rng(3), n = 22, top = [], bot = [];
        for (let i = 0; i <= n; i++) { top.push(`${(cw * i / n).toFixed(1)}px ${(r() * 9).toFixed(1)}px`); bot.unshift(`${(cw * i / n).toFixed(1)}px ${(ch - r() * 9).toFixed(1)}px`); }
        cbg.style.clipPath = `polygon(${top.concat(bot).join(",")})`;
      }
    } else if (E === "paper") {
      cw = 900; const tl = 96, tr = 84, tt = 205, tb = byEl ? 150 : 110;
      let y0 = 0.12 * H;
      if (pf) { size(pf, 620, 520); size(pimg, 580, 420); place(pimg, 20, 20); place(pf, 230, 0.075 * H); y0 = 0.075 * H + 520 - 40;
        place(ptape, 425, 0.075 * H - 34); ptape.style.transform = "rotate(5deg)"; }
      const maxH = 0.82 * H - y0 - tt - tb;
      fitText(T.px.quote, cw - tl - tr, FULL ? 5 : 6, maxH);
      ch = Math.max(pf ? 520 : 600, tt + txt.offsetHeight + tb);
      cx = 90; cy = pf ? y0 : Math.max(y0, 0.46 * H - ch / 2);
      place(txt, tl, tt); place(qm, 56, 26);
      if (byEl) place(byEl, cw - byEl.offsetWidth - 40, ch - 118);
      if (tape) { place(tape, cw / 2 - 170, -46); tape.style.transform = "rotate(-4deg)"; }
      if (eb) { place(eb, 70, -24); eb.style.transform = "rotate(-3deg)"; }
    } else if (E === "glass") {
      cw = 840; cx = 120; const top = (eb ? eb.offsetHeight + 40 : 0) + 150, tb = byEl ? 120 : 30;
      let y0 = 0.14 * H;
      if (pf) { size(pf, 840, 480); size(pimg, 838, 478); place(pimg, 0, 0); place(pf, 120, 0.09 * H); y0 = 0.09 * H + 480 + 50; }
      fitText(T.px.quote, cw, FULL ? 5 : 6, 0.82 * H - y0 - top - tb);
      ch = top + txt.offsetHeight + tb;
      cy = pf ? y0 : Math.max(y0, 0.46 * H - ch / 2);
      if (eb) place(eb, 4, 0);
      place(qm, -10, top - 170); place(txt, 0, top);
      if (rule) place(rule, 2, top + txt.offsetHeight + 54);
      if (byEl) place(byEl, 140, top + txt.offsetHeight + 54 - byEl.offsetHeight / 2);
    } else {   // journal: chữ nằm trong trang sổ
      const px0 = 90, py0 = 0.085 * H, ph = page.offsetHeight;
      place(page, px0, py0);
      place(washi, px0 + 450 - 190, py0 - 30); washi.style.transform = "rotate(-3deg)";
      place(branch, px0 - 30, py0 + ph - 400);   // góc dưới TRÁI (tên người nói canh phải)
      cw = 700; cx = px0 + 110;
      let y0 = py0 + 190;
      if (pf) { size(pf, 600, 440); size(pimg, 568, 378); place(pimg, 16, 16); place(pf, px0 + 150, py0 + 130); y0 = py0 + 130 + 440 + 40; }
      const top = (eb ? eb.offsetHeight + 24 : 0) + 120, tb = byEl ? 100 : 20;
      fitText(T.px.quote, cw, FULL ? 6 : 7, py0 + ph - 150 - y0 - top - tb);
      ch = top + txt.offsetHeight + tb;
      cy = pf ? y0 : Math.max(y0, py0 + ph * 0.47 - ch / 2);
      if (eb) place(eb, 0, 0);
      place(qm, -12, top - 150); place(txt, 0, top);
      if (byEl) place(byEl, cw - byEl.offsetWidth, top + txt.offsetHeight + 34);
    }
    size(card, cw, ch); size(sh, cw, ch); size(cbg, cw, ch); place(card, cx, cy);
    const parts = [rect(card), ...(pf ? [rect(pf)] : []), ...(byEl ? [rect(byEl)] : [])];
    const x0 = Math.min(...parts.map(p => p.x)), y0 = Math.min(...parts.map(p => p.y)), x1 = Math.max(...parts.map(p => p.x + p.w)), y1 = Math.max(...parts.map(p => p.y + p.h));
    QA.box = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 }; QA.area = QA.box;
    if (y1 > 0.84 * H) QA.overflow.push(`thẻ tràn đáy (y ${y1})`);
    QA.words = NW; QA.land = HIN; QA.full_at = +Math.min(DE - EX - 0.05, BY_T + 0.4).toFixed(3); QA.reveal_end = +RV1.toFixed(3);
    const read = DE - EX - RV1;
    if (NW && read < Math.max(0.5, NW * 0.08)) QA.warn.push(`đứng đọc ngắn: ${read.toFixed(2)}s cho ${NW} từ — kéo dài thẻ hoặc rút câu`);
    QA.keep = [];
  }

  function setTime(t0) {
    const t = clamp(t0, 0, D), kx = inCubic(prog(t, DE - EX, DE));
    if (bg) { const kb = outCubic(prog(t, 0, 0.3)); bg.style.opacity = kb; vig.style.opacity = kb; bg.style.transform = `scale(${(1.04 - 0.04 * t / D).toFixed(4)})`;
      if (light) { light.style.opacity = (0.45 * outCubic(prog(t, 0.15, 1.1))).toFixed(4); light.style.transform = `translateY(${lerp(-50, 40, t / D).toFixed(1)}px) scale(1.1)`; } }
    // thẻ vào
    let ky = 0, kop = 1, ksc = 1;
    if (E === "paper") { const k = prog(stop12(t), MICRO ? 0 : 0.08, MICRO ? 0.17 : 0.33); kop = t >= (MICRO ? 0 : 0.08) ? 1 : 0;
      ky = (1 - outBack(k, 1.3)) * (MICRO ? 40 : -110); ksc = 1 + (1 - k) * 0.04; }
    else if (E === "glass") { const k = outCubic(prog(t, 0.05, HIN + 0.1)); kop = MICRO ? k : 1; ky = MICRO ? (1 - k) * 24 : 0; }
    else { const k = outCubic(prog(t, 0, MICRO ? HIN : 0.45)); kop = Math.min(1, k * 3); ky = (1 - k) * (MICRO ? 30 : 220); }
    card.style.opacity = kop.toFixed(4); card.style.transform = `translateY(${ky.toFixed(1)}px)${ksc !== 1 ? ` scale(${ksc.toFixed(4)})` : ""}`;
    if (page) { page.style.opacity = card.style.opacity; page.style.transform = card.style.transform + " rotate(-1deg)";
      washi.style.opacity = t >= 0.4 ? 1 : 0; washi.style.transform = `translateY(${ky.toFixed(1)}px) rotate(-3deg) scale(${(1 + 0.12 * (1 - prog(t, 0.4, 0.5))).toFixed(3)})`;
      branch.style.opacity = outCubic(prog(t, 0.35, 0.8)).toFixed(4); branch.style.transform = `translateY(${ky.toFixed(1)}px) scaleX(-1) rotate(${(lerp(-4, 0, outCubic(prog(t, 0.35, 1.2)))).toFixed(2)}deg)`; }
    if (pf) { const k = E === "paper" ? prog(stop12(t), 0, 0.25) : outCubic(prog(t, 0.02, 0.5));
      pf.style.opacity = (E === "paper" ? (t >= 0 ? 1 : 0) : Math.min(1, k * 2)).toFixed(4);
      pf.style.transform = E === "paper" ? `translateY(${((1 - outBack(k, 1.3)) * -120).toFixed(1)}px)` : E === "glass" ? `scale(${(1.04 - 0.04 * k).toFixed(4)})` : `translateY(${ky.toFixed(1)}px)`;
      if (ptape) { ptape.style.opacity = t >= 0.25 ? 1 : 0; ptape.style.transform = `rotate(5deg) scale(${(1 + 0.15 * (1 - prog(stop12(t), 0.25, 0.34))).toFixed(3)})`; } }
    if (tape) { const ta = MICRO ? 0.12 : 0.36; tape.style.opacity = t >= ta ? 1 : 0;
      tape.style.transform = `rotate(${MICRO ? -6 : -4}deg) scale(${(1 + 0.15 * (1 - prog(stop12(t), ta, ta + 0.09))).toFixed(3)})`; }
    { const k = outCubic(prog(t, HIN * 0.5, HIN + 0.15)); qm.style.opacity = k.toFixed(4); qm.style.transform = `translateY(${((1 - k) * 18).toFixed(1)}px)`; }
    if (eb) { const k = E === "paper" ? prog(stop12(t), 0.3, 0.4) : outCubic(prog(t, 0.25, 0.6)); eb.style.opacity = (E === "paper" ? (t >= 0.3 ? 1 : 0) : k).toFixed(4);
      eb.style.transform = `${E === "paper" ? "rotate(-3deg) " : ""}translateX(${((1 - k) * -24).toFixed(1)}px)`; }
    // chữ từng từ + vạch nhấn
    WORDS.forEach((o, i) => {
      const ti = RV0 + i * PER, s = spans[i], k = prog(t, ti, ti + 0.22);
      if (E === "paper") { s.style.opacity = t >= ti ? 1 : 0; s.style.transform = `scale(${(1 + 0.16 * (1 - prog(t, ti, ti + 0.12))).toFixed(3)})`; }
      else { s.style.opacity = outCubic(k).toFixed(4); s.style.transform = `translateY(${((1 - outCubic(k)) * 14).toFixed(1)}px)`;
        if (E === "glass") s.style.filter = k < 1 ? `blur(${((1 - k) * 6).toFixed(2)}px)` : "none"; }
      if (o.mk) { const km = inOut(prog(t, ti + 0.18, ti + 0.5));
        if (E === "journal") o.mk.style.clipPath = `inset(0 ${((1 - km) * 100).toFixed(2)}% 0 0)`;
        else o.mk.style.transform = `scaleX(${km.toFixed(4)})`;
        o.mk.style.visibility = km > 0 ? "visible" : "hidden"; }
    });
    if (byEl) { const k = outCubic(prog(t, BY_T + (rule ? 0.2 : 0), BY_T + (rule ? 0.55 : 0.35)));
      if (E === "paper") { byEl.style.opacity = t >= BY_T ? 1 : 0; byEl.style.transform = `translateX(${((1 - outBack(prog(stop12(t), BY_T, BY_T + 0.17), 1.4)) * 50).toFixed(1)}px)`; }
      else { byEl.style.opacity = k.toFixed(4); byEl.style.transform = `translateX(${((1 - k) * 20).toFixed(1)}px)`; }
      if (rule) rule.style.transform = `scaleX(${inOut(prog(t, BY_T, BY_T + 0.35)).toFixed(4)})`; }
    root.style.opacity = (t >= DE - 1e-6 ? 0 : 1 - kx).toFixed(4);
    root.style.filter = kx > 0.001 ? `blur(${(8 * kx).toFixed(2)}px)` : "none";
  }

  const fams = [...new Set(Object.values(T.fonts))];
  const ready = Promise.all([
    ...fams.map(f => document.fonts.load(`50px "${f}"`, QUOTE + BY + EYEBROW + "“—Ợ")),
    ...imgs.map(im => im.decode().catch(() => { throw new Error("thiếu ảnh " + im.src); })),
  ]).then(() => { layout(); setTime(0); });

  window.setTime = setTime;
  window.SCENE_MOTION = { name: `Quote · ${T.label} · ${PRESET}`, duration: D, width: W, height: H, fps: FPS,
    ready, setTime, qa: QA,
    scenes: [{ name: "thẻ vào", start: 0, end: HIN }, { name: "chữ hiện từng từ", start: RV0, end: RV1 }, { name: "đứng đọc", start: RV1, end: DE - EX },
             { name: "ra", start: DE - EX, end: D }] };
  if (!Q.has("render")) {
    const t0 = performance.now();
    (function loop() { setTime(((performance.now() - t0) / 1000) % (D + 0.6)); requestAnimationFrame(loop); })();
  }
})();
</script>
</body>
