<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>List Motion</title>
<!-- Scene Library · C13 List Motion v1.0 (Claude viết 07/11/2026) — assets/scenes/list-motion/scene.json.
     Danh sách DỰNG THEO LỜI, 3 kiểu (học mẫu m2 / Blue 1 — example/_phan-tich):
       tick   = mục trồi ra lần lượt, ô tròn bật dấu tick màu nhấn (lợi ích, checklist)
       toggle = mọi mục hiện sẵn mờ, công tắc kiểu điện thoại BẬT dần theo lời (công dụng, tính năng)
       strike = mục hiện rồi bị GẠCH NGANG + dấu ✕ (bỏ cách cũ / phủ định), cuối hiện chip kết luận `conclude`
     Hợp đồng Motion Engine: window.setTime(giây) vẽ ĐỒNG BỘ, không Internet, KHÔNG will-change, khung cuối trong suốt.
     Query: theme (ui_dark|ui_light) · preset (micro|standard|full) · dur · brand · accent · mode · title · eyebrow ·
     items (JSON [{t, x, n}]) · conclude · y · seed. -->
<style>
  @font-face { font-family: "GdpBold"; src: url("fonts/UTM_AvoBold.ttf"); }
  @font-face { font-family: "GdpReg"; src: url("fonts/UTM_Avo.ttf"); }
  @font-face { font-family: "PhBold"; src: url("fonts/Averta-Bold.otf"); }
  @font-face { font-family: "PhReg"; src: url("fonts/Averta-Regular.otf"); }
  @font-face { font-family: "PhLight"; src: url("fonts/Averta-Light.otf"); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; white-space: nowrap; box-sizing: border-box; }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script src="uikit.js"></script>
<script>
(function () {
  const U = window.UIKIT, { Q, W, H, FPS, T, F, ACC, clamp, lerp, prog, outCubic, outBack, inOut, node, place, fitFont, show } = U;
  const PRESETS = { micro: { min: 1.5, def: 3 }, standard: { min: 2.0, def: 4 }, full: { min: 3.0, def: 5 } };
  const PRESET = PRESETS[Q.get("preset")] ? Q.get("preset") : "standard";
  const D = Math.max(PRESETS[PRESET].min, parseFloat(Q.get("dur") || PRESETS[PRESET].def) || PRESETS[PRESET].def);
  const MICRO = PRESET === "micro", FULL = PRESET === "full";
  const MODE = ["tick", "toggle", "strike"].includes(Q.get("mode")) ? Q.get("mode") : "tick";
  const MAXN = MICRO ? 4 : 6;
  let ITEMS = U.items().slice(0, MAXN);
  if (!ITEMS.length) ITEMS = [{ t: 0.6, x: "Mục 1" }];
  const TITLE = MICRO ? "" : (Q.get("title") || "").trim(), EYEBROW = (Q.get("eyebrow") || "").trim();
  const CONCLUDE = MICRO ? "" : (Q.get("conclude") || "").trim();
  const DE = D - 1 / FPS, EX = MICRO ? 0.22 : 0.3;
  const QA = { theme: U.THEME_ID, preset: PRESET, mode: MODE, dur: D, overflow: [], warn: [], fontPx: {} };
  if (U.items().length > MAXN) QA.warn.push(`chỉ hiện ${MAXN} mục đầu (preset ${PRESET})`);
  // thời điểm từng mục (giây từ lúc thẻ vào); sát cuối → dồn lên để kịp đọc
  ITEMS.forEach((it, i) => { it.t = clamp(+it.t || (0.6 + i * 0.5), 0.25, DE - EX - 0.45); it.label = U.splitIcon(it.x).text; });

  const S = MICRO ? { w: 0.62 * W, row: 66, px: 36, gap: 12, pad: 22 } : FULL ? { w: 0.82 * W, row: 118, px: 54, gap: 22, pad: 34 }
                  : { w: 0.78 * W, row: 100, px: 46, gap: 18, pad: 30 };
  const sc = MICRO ? null : U.scrim(FULL ? 0 : 0.36);
  const bgFull = FULL ? node("div", { width: W + "px", height: H + "px",
    background: U.THEME_ID === "ui_dark" ? "linear-gradient(180deg,#141416 0%,#0b0b0c 100%)" : "linear-gradient(180deg,#f6f6f8 0%,#e9eaef 100%)" }) : null;
  const head = (TITLE || EYEBROW) ? U.heading(EYEBROW, TITLE, { y: FULL ? 0.2 * H : 0.15 * H, tPx: FULL ? 96 : 80 }) : null;
  const panel = U.card({ width: S.w + "px", padding: S.pad + "px", borderRadius: (MICRO ? 24 : 32) + "px",
    background: FULL ? "transparent" : T.card, border: FULL ? "none" : `1.5px solid ${T.line}`, boxShadow: FULL ? "none" : T.shadow });
  const rows = ITEMS.map((it, i) => {
    const r = node("div", { position: "relative", width: (S.w - 2 * S.pad) + "px", height: S.row + "px", marginTop: i ? S.gap + "px" : "0",
      background: T.card2, borderRadius: (S.row / 2.6) + "px", border: `1px solid ${T.line}` }, panel);
    const lab = node("div", { fontFamily: F.bold, fontSize: S.px + "px", color: T.text, top: "50%", left: (S.row * 0.95) + "px",
      transform: "translateY(-50%)", transformOrigin: "0 50%" }, r, it.label);
    const maxW = S.w - 2 * S.pad - S.row * (MODE === "toggle" ? 2.3 : 1.25);
    if (!fitFont(lab, S.px, maxW, 0.6)) QA.overflow.push(`mục ${i + 1} dài: '${it.label}'`);
    QA.fontPx["item" + i] = parseFloat(lab.style.fontSize);
    let mark = null, line = null, sw = null, knob = null;
    const d = S.row * 0.58;
    if (MODE === "toggle") {   // công tắc bên phải, nhãn bên trái
      lab.style.left = (S.row * 0.42) + "px";
      sw = node("div", { width: (d * 1.75) + "px", height: d + "px", borderRadius: d + "px", top: ((S.row - d) / 2) + "px",
        left: (S.w - 2 * S.pad - d * 1.75 - S.row * 0.32) + "px", background: T.off }, r);
      knob = node("div", { width: (d - 8) + "px", height: (d - 8) + "px", borderRadius: "50%", top: "4px", left: "4px",
        background: "#ffffff", boxShadow: "0 3px 8px rgba(0,0,0,.3)" }, sw);
    } else {
      mark = node("div", { width: d + "px", height: d + "px", borderRadius: "50%", top: ((S.row - d) / 2) + "px", left: (S.row * 0.22) + "px",
        border: `3px solid ${MODE === "strike" ? T.faint : U.rgba(ACC, 0.7)}`, display: "flex", alignItems: "center", justifyContent: "center" }, r);
      mark.innerHTML = U.icon(MODE === "strike" ? "x" : "check", MODE === "strike" ? T.text : U.onAcc, d * 0.62, 3);
      mark.firstChild.style.opacity = 0;
      if (MODE === "strike") line = node("div", { height: (S.px * 0.09) + "px", top: "50%", left: (S.row * 0.9) + "px",
        width: (lab.offsetWidth + 20) + "px", background: ACC, transformOrigin: "0 50%", borderRadius: "4px" }, r);
    }
    return { it, r, lab, mark, line, sw, knob, d };
  });
  let pill = null;
  if (CONCLUDE) { pill = node("div", { fontFamily: F.bold, fontSize: (S.px * 0.92) + "px", color: U.onAcc, background: ACC,
    borderRadius: "999px", padding: `${S.px * 0.3}px ${S.px * 0.8}px`, display: "flex", alignItems: "center", gap: "14px" });
    pill.innerHTML = U.icon(U.iconFor(CONCLUDE, "sparkle"), U.onAcc, S.px * 0.9, 2.4) + `<span style="position:static">${CONCLUDE}</span>`; }
  const T_CON = pill ? Math.min(DE - EX - 0.6, ITEMS[ITEMS.length - 1].t + 0.9) : 0;

  function layout() {
    const ph = panel.offsetHeight, pw = S.w;
    const yc = MICRO ? 0.13 * H : FULL ? (head ? 0.2 * H + head.h + 60 : 0.3 * H)
             : clamp(parseFloat(Q.get("y") || "0.30"), 0.14, 0.62) * H - ph / 2 + (head ? head.h * 0.5 : 0);
    const px = MICRO ? (Q.get("side") === "right" ? 0.84 * W - pw : 0.06 * W) : (W - pw) / 2;
    let py = Math.max(MICRO ? 0.12 * H : 0.13 * H + (head && !FULL ? head.h + 30 : 0), yc);
    if (head && !FULL) place(head.wrap, (W - 0.78 * W) / 2, py - head.h - 26);
    place(panel, px, py);
    if (pill) { place(pill, (W - pill.offsetWidth) / 2, py + ph + 40); if (pill.offsetWidth > 0.8 * W) QA.overflow.push("chip kết luận dài"); }
    const bottom = py + ph + (pill ? pill.offsetHeight + 40 : 0);
    if (bottom > 0.76 * H) QA.overflow.push(`danh sách xuống quá vùng an toàn (đáy ${(bottom / H).toFixed(2)}H)`);
    const top = head && !FULL ? py - head.h - 26 : py;
    QA.area = { x: Math.round(px), y: Math.round(top), w: Math.round(pw), h: Math.round(bottom - top) };
    QA.land = MICRO ? 0.35 : 0.5;
  }

  function setTime(t0) {
    const t = clamp(t0, 0, D);
    if (sc) sc.style.opacity = outCubic(prog(t, 0, 0.3)).toFixed(4);
    if (bgFull) bgFull.style.opacity = outCubic(prog(t, 0, 0.25)).toFixed(4);
    const kp = outBack(prog(t, 0.05, 0.42), 1.3);
    show(panel, outCubic(prog(t, 0.05, 0.35)), 40, MICRO || FULL ? 0 : 0.06);
    if (FULL) panel.style.transform = "none";
    if (head) { show(head.e, outCubic(prog(t, 0.08, 0.4)), 18); show(head.t, outCubic(prog(t, 0.14, 0.48)), 26); }
    rows.forEach((R, i) => {
      const ta = R.it.t;
      if (MODE === "toggle") {
        show(R.r, outCubic(prog(t, 0.1 + i * 0.05, 0.42 + i * 0.05)), 16);
        const k = inOut(prog(t, ta - 0.08, ta + 0.2));
        R.sw.style.background = k > 0.5 ? ACC : T.off;
        R.knob.style.transform = `translateX(${(k * R.d * 0.75).toFixed(1)}px)`;
        R.lab.style.opacity = lerp(0.42, 1, k).toFixed(3);
      } else {
        const k = outCubic(prog(t, ta - 0.12, ta + 0.2));
        R.r.style.opacity = k.toFixed(4);
        R.r.style.transform = `translateX(${((1 - k) * -40).toFixed(1)}px)`;
        const km = outBack(prog(t, ta, ta + 0.25), 2);
        if (MODE === "tick") { R.mark.style.background = km > 0.05 ? ACC : "transparent"; R.mark.style.borderColor = km > 0.05 ? ACC : U.rgba(ACC, 0.7);
          R.mark.firstChild.style.opacity = clamp(km).toFixed(3);
          R.mark.style.transform = prog(t, ta, ta + 0.25) >= 1 ? "none" : `scale(${(0.7 + 0.3 * km).toFixed(4)})`; }
        else {   // strike: gạch ngang sau khi mục hiện 0,35s, chữ mờ đi
          const ks = inOut(prog(t, ta + 0.32, ta + 0.62));
          R.line.style.transform = `translateY(-50%) scaleX(${ks.toFixed(4)})`;
          R.lab.style.opacity = lerp(1, 0.45, ks).toFixed(3);
          R.mark.firstChild.style.opacity = ks.toFixed(3);
        }
      }
    });
    if (pill) { const k = outBack(prog(t, T_CON, T_CON + 0.35), 1.8); pill.style.opacity = clamp(k * 1.5).toFixed(3);
      pill.style.transform = `scale(${(0.6 + 0.4 * k).toFixed(4)})`; }
    U.exitAll(t, D, EX);
  }

  const ready = U.ready(TITLE + EYEBROW + CONCLUDE + ITEMS.map(i => i.label).join(""), () => { layout(); setTime(0); });
  window.setTime = setTime;
  window.SCENE_MOTION = { name: `List Motion · ${MODE} · ${T.label} · ${PRESET}`, duration: D, width: W, height: H, fps: FPS,
    ready, setTime, qa: QA,
    scenes: [{ name: "vào", start: 0, end: 0.45 }, { name: "từng mục theo lời", start: 0.45, end: DE - EX }, { name: "ra", start: DE - EX, end: D }] };
  if (!Q.has("render")) { const t0 = performance.now();
    (function loop() { setTime(((performance.now() - t0) / 1000) % (D + 0.6)); requestAnimationFrame(loop); })(); }
})();
</script>
</body>
</html>
