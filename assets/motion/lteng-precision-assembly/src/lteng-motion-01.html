<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>LTENG Motion 01 — Precision Assembly (render)</title>
<!-- Transparent overlay 1080×1920, 4.0 s. No CDN.
     Every stroke is a cut-out of the official artwork (assets/lteng-white.png, 800×194); at lock the cut-outs are replaced
     by the single uncut artwork, so the end frame is the original logo. BLUE VINE = assets/blue-vine-white.png. -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { display: block; background: transparent; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#07143A"/><path d="M22 34 V66 H40 M44 34 H62 M53 34 V66" fill="none" stroke="#FFFFFF" stroke-width="6"/><rect x="62" y="47" width="16" height="6" fill="#DD127B"/><path d="M14 30 H86 M14 70 H86" stroke="#96C0FF" stroke-width="1"/></svg></template>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <clipPath id="cpRegion" clipPathUnits="userSpaceOnUse"><rect x="14" y="36" width="721" height="152"/></clipPath>
    <clipPath id="cpLetters" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="731" height="194"/></clipPath>
    <clipPath id="cpRegBox" clipPathUnits="userSpaceOnUse"><rect x="731" y="0" width="69" height="100"/></clipPath>
    <clipPath id="cpRegWedge" clipPathUnits="userSpaceOnUse"><path id="regWedge" d=""/></clipPath>
    <clipPath id="cpMagSlot" clipPathUnits="userSpaceOnUse"><rect x="291" y="100" width="114" height="45"/></clipPath>
    <clipPath id="cpMag" clipPathUnits="userSpaceOnUse"><rect x="319" y="109" width="79" height="26"/></clipPath>
    <clipPath id="cpSub" clipPathUnits="userSpaceOnUse"><rect id="subClip" x="394.5" y="262" width="0" height="66.8"/></clipPath>
    <linearGradient id="gSheen" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <g id="pieceClips"></g>
  </defs>
  <g id="all">
    <g id="logo">
      <g id="guides" fill="none"></g>
      <g id="pieces" clip-path="url(#cpRegion)"></g>
      <image id="full" class="art" x="0" y="0" width="800" height="194" clip-path="url(#cpLetters)" visibility="hidden"/>
      <g clip-path="url(#cpMagSlot)">
        <g id="magG" visibility="hidden">
          <rect x="319" y="109" width="79" height="26" fill="#DD127B"/>
          <rect id="sheen" x="0" y="109" width="26" height="26" fill="url(#gSheen)" clip-path="url(#cpMag)" opacity="0"/>
        </g>
      </g>
      <g id="nodes"></g>
      <g clip-path="url(#cpRegWedge)"><image id="reg" class="art" x="0" y="0" width="800" height="194" clip-path="url(#cpRegBox)" visibility="hidden"/></g>
      <g id="subG"><image id="sub" x="394.5" y="262" width="335" height="66.8" clip-path="url(#cpSub)" visibility="hidden"/></g>
      <line id="subScan" y1="262" y2="328.8" stroke="#96C0FF" stroke-width="2" vector-effect="non-scaling-stroke" opacity="0"/>
    </g>
  </g>
</svg>
<script>
(function () {
  const DURATION = 4.0, W = 1080, H = 1920;
  const ART = 'assets/lteng-white.png', SUB = 'assets/blue-vine-white.png';
  const NS = 'http://www.w3.org/2000/svg', XL = 'http://www.w3.org/1999/xlink';

  const c01 = (v) => Math.max(0, Math.min(1, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const tw = (T, a, b) => c01((T - a) / (b - a));
  const E = {
    out: (t, k = 3) => 1 - Math.pow(1 - t, k),
    io: (t, k = 3) => (t < 0.5 ? Math.pow(2 * t, k) / 2 : 1 - Math.pow(2 - 2 * t, k) / 2),
  };
  const f = (v, n = 3) => (+v).toFixed(n);

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) && q.get(k) !== '' && !isNaN(+q.get(k)) ? +q.get(k) : d);
  const opts = {
    width: num('width', 0.78),        // letters L→® width / frame width
    nx: num('nx', 0.5),               // lock-up centre (0–1)
    ny: num('ny', 0.5),
    subline: q.get('subline') !== '0',
  };

  // ---- Timeline (s)
  const TL = {
    guidesIn: [0, 0.45], build: [0.45, 1.65], align: [1.65, 1.98], lock: 1.98, magenta: [2.15, 2.5],
    sub: [2.5, 3.05], hold: [3.05, 3.55], out: [3.55, 4.0],
  };
  const LETTER_START = [0.45, 0.64, 0.83, 1.02, 1.21], STAGGER = 0.06, PIECE_DUR = 0.26, TRAVEL = 150, GAP = 10;

  // ---- Cut-outs of the official artwork (logo px). Rects partition every opaque letter pixel exactly once (verified).
  // [id, rect x0,y0,x1,y1, entry direction (unit, the side it comes from), letter, order]
  const D45 = Math.SQRT1_2, ND = [-0.7797, -0.6261];
  const PIECES = [
    ['L1', [20, 30, 66, 147], [0, -1], 0, 0], ['L2', [20, 147, 166, 190], [-1, 0], 0, 1],
    ['T1', [120, 30, 262, 81], [1, 0], 1, 0], ['T2', [166, 81, 220, 190], [0, 1], 1, 1],
    ['E1', [258, 30, 291, 190], [0, -1], 2, 0], ['E2', [291, 30, 405, 100], [1, 0], 2, 1], ['E3', [291, 100, 405, 190], [1, 0], 2, 2],
    ['N1', [405, 30, 438, 190], [0, 1], 3, 0], ['N2', [438, 30, 543, 190], ND, 3, 1], ['N3', [543, 30, 576, 190], [0, -1], 3, 2],
    ['G1', [576, 30, 610, 190], [0, 1], 4, 0], ['G2', [610, 30, 731, 85], [1, 0], 4, 1], ['G4', [610, 85, 731, 147], [D45, D45], 4, 2], ['G3', [610, 147, 731, 190], [1, 0], 4, 3],
  ];
  const BLUE = '150,192,255', WHITE = '255,255,255';
  const HGUIDES = [[54, BLUE, 0.75, 2], [173, BLUE, 0.75, 2], [80, BLUE, 0.35, 1.5], [147, BLUE, 0.35, 1.5], [122, WHITE, 0.5, 1.5, '6 6']];
  const VGUIDES = [[38, BLUE, 0.55], [193, WHITE, 0.45, '6 6'], [265, BLUE, 0.55], [412, BLUE, 0.55], [583, BLUE, 0.55], [726, BLUE, 0.55]];
  const GX0 = 14, GX1 = 752, GY0 = 36, GY1 = 190;
  const CORNERS = [[GX0, GY0, 1, 1], [GX1, GY0, -1, 1], [GX0, GY1, 1, -1], [GX1, GY1, -1, -1]];
  const JOINTS = [[51, 160], [193, 67], [278, 67], [278, 160], [425, 67], [556, 160], [596, 67], [596, 160]];
  const REG = { cx: 767.5, cy: 45, r: 40 };
  const LCX = 418;

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const setHref = (n, src) => { n.setAttribute('href', src); n.setAttributeNS(XL, 'xlink:href', src); };

  const logo = $('logo'), all = $('all'), full = $('full'), magG = $('magG'), sheen = $('sheen'), reg = $('reg'), sub = $('sub');
  [full, reg].forEach((n) => setHref(n, ART)); setHref(sub, SUB);

  const pieceEls = PIECES.map(([id, r]) => {
    const cp = el('clipPath', { id: 'cp_' + id, clipPathUnits: 'userSpaceOnUse' }, $('pieceClips'));
    el('rect', { x: r[0], y: r[1], width: r[2] - r[0], height: r[3] - r[1] }, cp);
    const g = el('g', { visibility: 'hidden' }, $('pieces'));
    const im = el('image', { x: 0, y: 0, width: 800, height: 194, 'clip-path': `url(#cp_${id})` }, g);
    setHref(im, ART);
    return g;
  });
  const lineAttrs = (col, a, w, dash) => ({ stroke: `rgba(${col},${a})`, 'stroke-width': w || 1.5, 'vector-effect': 'non-scaling-stroke', ...(dash ? { 'stroke-dasharray': dash } : {}) });
  const hEls = HGUIDES.map(([y, c, a, w, d]) => el('line', { y1: y, y2: y, ...lineAttrs(c, a, w, d) }, $('guides')));
  const vEls = VGUIDES.map(([x, c, a, d]) => el('line', { x1: x, x2: x, ...lineAttrs(c, a, 1.5, d) }, $('guides')));
  const cEls = CORNERS.map(() => el('path', { ...lineAttrs(WHITE, 0.8, 2), 'stroke-linecap': 'square' }, $('guides')));
  const nEls = JOINTS.map(() => el('rect', { fill: '#FFFFFF' }, $('nodes')));

  const ready = Promise.all([ART, SUB].map((src) => { const i = new Image(); i.src = src; return i.decode ? i.decode().catch(() => {}) : Promise.resolve(); }))
    .then(() => { document.documentElement.dataset.ready = '1'; });

  const wedge = (a) => {
    if (a <= 0) return 'M0 0Z';
    if (a >= 359.9) return `M${REG.cx - REG.r} ${REG.cy - REG.r}h${REG.r * 2}v${REG.r * 2}h${-REG.r * 2}Z`;
    const rad = (d) => (d - 90) * Math.PI / 180;
    const x = REG.cx + REG.r * Math.cos(rad(a)), y = REG.cy + REG.r * Math.sin(rad(a));
    return `M${REG.cx} ${REG.cy} L${REG.cx} ${REG.cy - REG.r} A${REG.r} ${REG.r} 0 ${a > 180 ? 1 : 0} 1 ${f(x)} ${f(y)} Z`;
  };

  let T = 0;
  function render(t) {
    T = Math.max(0, Math.min(DURATION, +t || 0));
    const s = (opts.width * W) / (798 - 38);
    const LCY = opts.subline ? (54 + 328.8) / 2 : (54 + 173) / 2;
    logo.setAttribute('transform', `translate(${f(opts.nx * W)} ${f(opts.ny * H)}) scale(${f(s, 5)}) translate(${-LCX} ${f(-LCY)})`);

    const alpha = 1 - E.io(tw(T, TL.out[0], TL.out[1]), 2);
    all.setAttribute('opacity', f(alpha, 4));
    all.setAttribute('visibility', alpha <= 0.0005 ? 'hidden' : 'visible');

    // guides: draw in 0–0.45 (H from centre outward, V from top down), retract 2.6–3.05
    const mid = (GX0 + GX1) / 2;
    hEls.forEach((n, i) => {
      const p = E.out(tw(T, i * 0.03, i * 0.03 + 0.26), 3), r = E.io(tw(T, 2.6 + i * 0.03, 2.9 + i * 0.03), 2);
      const half = (GX1 - GX0) / 2 * p * (1 - r);
      n.setAttribute('x1', f(mid - half)); n.setAttribute('x2', f(mid + half));
      n.setAttribute('visibility', half > 0.1 ? 'visible' : 'hidden');
    });
    vEls.forEach((n, i) => {
      const p = E.out(tw(T, 0.08 + i * 0.03, 0.30 + i * 0.03), 3), r = E.io(tw(T, 2.62 + i * 0.03, 2.9 + i * 0.03), 2);
      const y0 = lerp(GY0, GY1, r * 0.5), y1 = lerp(GY0, GY1, p) - (GY1 - GY0) * 0.5 * r;
      n.setAttribute('y1', f(y0)); n.setAttribute('y2', f(Math.max(y0, y1)));
      n.setAttribute('visibility', y1 - y0 > 0.1 ? 'visible' : 'hidden');
    });
    const cIn = E.out(tw(T, 0.2, 0.45), 3), cOut = E.io(tw(T, 2.75, 3.05), 2), cl = 16 * cIn * (1 - cOut);
    cEls.forEach((n, i) => {
      const [x, y, dx, dy] = CORNERS[i];
      n.setAttribute('d', cl > 0.1 ? `M${x} ${y + dy * cl}V${y}H${x + dx * cl}` : 'M0 0');
      n.setAttribute('opacity', f(cIn * (1 - cOut), 3));
    });

    // build 0.45–1.65 · align 1.65–1.98 · lock 1.98
    const close = E.io(tw(T, TL.align[0], TL.align[1]), 3), locked = T >= TL.lock;
    PIECES.forEach(([, , dir, li, k], i) => {
      const g = pieceEls[i], st = LETTER_START[li] + k * STAGGER, p = tw(T, st, st + PIECE_DUR);
      if (T < st || locked) { g.setAttribute('visibility', 'hidden'); return; }
      const d = TRAVEL * (1 - E.out(p, 4)) + GAP * (1 - close);
      g.setAttribute('visibility', 'visible');
      g.setAttribute('transform', `translate(${f(dir[0] * d)} ${f(dir[1] * d)})`);
      g.setAttribute('opacity', f(c01(p * 4), 3));
    });
    full.setAttribute('visibility', locked ? 'visible' : 'hidden');
    const np = tw(T, TL.lock, TL.lock + 0.32), nSize = 8 / s * lerp(1.8, 1, E.out(c01(np * 3), 3));
    nEls.forEach((n, i) => {
      const [x, y] = JOINTS[i];
      const on = np > 0 && np < 1;
      n.setAttribute('visibility', on ? 'visible' : 'hidden');
      if (!on) return;
      n.setAttribute('x', f(x - nSize / 2)); n.setAttribute('y', f(y - nSize / 2)); n.setAttribute('width', f(nSize)); n.setAttribute('height', f(nSize));
      n.setAttribute('opacity', f(c01(np * 6) * (1 - E.io(tw(np, 0.45, 1), 2)), 3));
    });

    // magenta 2.15–2.5: slides in from the open side of the E, then one short sheen
    const mp = E.out(tw(T, TL.magenta[0], 2.36), 4);
    magG.setAttribute('visibility', T >= TL.magenta[0] ? 'visible' : 'hidden');
    magG.setAttribute('transform', `translate(${f(86 * (1 - mp))} 0)`);
    const sp = tw(T, 2.30, 2.50);
    sheen.setAttribute('x', f(lerp(293, 398, E.io(sp, 2))));
    sheen.setAttribute('opacity', f(sp > 0 && sp < 1 ? Math.sin(Math.PI * sp) : 0, 3));

    // ® 2.5–2.9 clockwise sweep · BLUE VINE 2.55–2.95 left→right wipe
    const ra = 360 * E.io(tw(T, 2.5, 2.9), 2);
    reg.setAttribute('visibility', ra > 0 ? 'visible' : 'hidden');
    $('regWedge').setAttribute('d', wedge(ra));
    const wp = E.io(tw(T, 2.55, 2.95), 3), ww = 335 * wp;
    sub.setAttribute('visibility', opts.subline && ww > 0 ? 'visible' : 'hidden');
    $('subClip').setAttribute('width', f(ww));
    const scan = $('subScan');
    scan.setAttribute('x1', f(394.5 + ww)); scan.setAttribute('x2', f(394.5 + ww));
    scan.setAttribute('opacity', f(opts.subline && wp > 0 && wp < 1 ? 0.9 * Math.sin(Math.PI * wp) : 0, 3));
  }

  let auto = !q.has('render'), t0 = null;
  function tick(now) {
    if (!auto) return;
    if (t0 === null) t0 = now;
    render(((now - t0) / 1000) % (DURATION + 0.8));
    requestAnimationFrame(tick);
  }

  const META = {
    name: 'LTENG Motion 01 — Precision Assembly', id: 'lteng-motion-01',
    width: W, height: H, duration: DURATION, fps: 30, frames: 120, alpha: true,
    scenes: [
      { name: 'Guide lines', start: 0, end: 0.45 }, { name: 'Dựng nét', start: 0.45, end: 1.65 }, { name: 'Căn & khớp', start: 1.65, end: 2.15 },
      { name: 'Magenta', start: 2.15, end: 2.5 }, { name: 'BLUE VINE ®', start: 2.5, end: 3.05 }, { name: 'Giữ', start: 3.05, end: 3.55 }, { name: 'Fade-out', start: 3.55, end: 4.0 },
    ],
  };
  window.setTime = function (seconds) { auto = false; render(seconds); return T; };
  window.LTENG_MOTION = Object.assign(META, {
    ready, setTime: window.setTime,
    configure(o) { Object.assign(opts, o || {}); render(T); return { ...opts }; },
    get time() { return T; }, get options() { return { ...opts }; },
  });
  window.GDP_MOTION = window.LTENG_MOTION;   // same exporter contract as the GDP motions (export-frames.mjs)
  render(q.has('t') ? num('t', 0) : 0);
  if (auto) ready.then(() => requestAnimationFrame(tick));
})();
</script>
</body>
</html>
