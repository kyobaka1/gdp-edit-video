<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>GDP Motion 03 — Peek-a-Boo (render)</title>
<meta name="viewport" content="width=1080">
<!-- Transparent 1080×1920 overlay. No CDN, no external assets.
     Icon = vector rebuild of the original GDP mark, fitted to the source cut-outs (IoU: house 0.998 · plus 0.989 · smile 0.97). -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { display: block; width: 1080px; height: 1920px; background: transparent; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#F5F1EA"/><path d="M-6 34 L18 12 L42 34 V72 H-6 Z" fill="#C22026"/></svg></template>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <g id="mirror">
    <g id="fade">
      <g id="icon">
        <path id="house" fill="#C22026" d="M243.53 11.71 L412.53 168.13 A42 42 0 0 1 426 198.95 L426 400 A50 50 0 0 1 376 450 L54 450 A50 50 0 0 1 4 400 L4 198.95 A42 42 0 0 1 17.47 168.13 L186.47 11.71 A42 42 0 0 1 243.53 11.71 Z"/>
        <g id="plus"><path d="M215 168.5 V224.5 M187 196.5 H243" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/></g>
        <g id="smile" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round">
          <path id="smileL" pathLength="1" stroke-dasharray="0 2"/>
          <path id="smileR" pathLength="1" stroke-dasharray="0 2"/>
        </g>
      </g>
    </g>
  </g>
</svg>
<script>
(function () {
  const W = 1080, H = 1920, DURATION = 2.5;
  const V = { w: 430, h: 454, cx: 215, cy: 227, plus: { x: 215, y: 196.5 }, smile: { cx: 215.08, cy: 157.43, r: 173.99, half: 39.5 } };
  const PEEK = 0.65;                                   // share of the icon's own width that comes into frame

  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const tw = (T, a, b) => clamp01((T - a) / (b - a));
  const E = {
    enter: (t) => { const c = 0.7, u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; },   // Outro v2 curve
    move: (t, k = 3) => (t < 0.5 ? Math.pow(2 * t, k) / 2 : 1 - Math.pow(2 - 2 * t, k) / 2),
    out: (t, k = 3) => 1 - Math.pow(1 - t, k),
    pop: (t) => (t <= 0 || t >= 1 ? 0 : Math.sin(Math.PI * (1 - (1 - t) * (1 - t)))),
    bump: (t) => (t <= 0 || t >= 1 ? 0 : Math.sin(Math.PI * E.move(t, 2))),
  };

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) && q.get(k) !== '' && !isNaN(+q.get(k)) ? +q.get(k) : d);
  const opts = {
    side: q.get('side') === 'right' ? 'right' : 'left',
    verticalPosition: num('verticalPosition', 0.30),   // icon centre, 0 = top · 1 = bottom
    size: num('size', 0.18),                           // icon width / frame width
  };

  // Smile halves start at the bottom centre and run outward, so the round caps travel with the stroke ends.
  const S = V.smile, rad = (a) => a * Math.PI / 180;
  const pt = (a) => `${(S.cx + S.r * Math.cos(rad(a))).toFixed(2)} ${(S.cy + S.r * Math.sin(rad(a))).toFixed(2)}`;
  document.getElementById('smileL').setAttribute('d', `M${pt(90)} A${S.r} ${S.r} 0 0 1 ${pt(90 + S.half)}`);
  document.getElementById('smileR').setAttribute('d', `M${pt(90)} A${S.r} ${S.r} 0 0 0 ${pt(90 - S.half)}`);

  const $ = (id) => document.getElementById(id);
  const mirror = $('mirror'), fade = $('fade'), icon = $('icon'), plus = $('plus'), smile = $('smile'), sL = $('smileL'), sR = $('smileR');
  const f = (v, n = 3) => (+v).toFixed(n);

  let T = 0;
  function render(t) {
    T = Math.max(0, Math.min(DURATION, +t || 0));
    const s = (opts.size * W) / V.w, iw = V.w * s, ih = V.h * s, k = s / 0.452;   // k: motion amplitudes scale with icon size
    const cy = opts.verticalPosition * H;
    const xRest = -(1 - PEEK) * iw + iw / 2;           // 65% of the icon inside the frame
    const xHide = -iw * 0.62;

    // 0.00–0.45 · slide in and lean around the frame edge
    let x = lerp(xHide, xRest, E.enter(tw(T, 0.0, 0.45)));
    let lean = 7 * E.out(tw(T, 0.04, 0.50));
    // 0.45–0.85 · curious head tilt
    let tilt = 6 * E.move(tw(T, 0.45, 0.74));
    let y = -5 * k * E.bump(tw(T, 0.45, 0.85));
    // 0.85–1.30 · plus lights up, smile draws, arc lifts; head tilts back the happy way
    tilt = lerp(tilt, -2.5, E.move(tw(T, 0.88, 1.26)));
    const plusOp = lerp(0.4, 1, E.out(tw(T, 0.85, 1.0)));
    const plusS = 1 + 0.14 * E.pop(tw(T, 0.85, 1.12));
    const smileP = E.enter(tw(T, 0.92, 1.20));
    const arc = E.bump(tw(T, 1.02, 1.34));
    // 1.30–1.85 · one tiny bob
    const dip = E.pop(tw(T, 1.36, 1.54)), hop = E.pop(tw(T, 1.50, 1.80));
    const sqx = 1 + 0.03 * dip - 0.01 * hop, sqy = 1 - 0.035 * dip + 0.02 * hop;
    y -= 9 * k * hop;
    // 1.85–2.50 · small wind-up, soft retreat, ends at opacity 0
    x += 0.04 * iw * E.pop(tw(T, 1.85, 2.02));
    const out = E.move(tw(T, 1.96, 2.46), 2);
    x = lerp(x, xHide, out);
    lean *= 1 - out;
    tilt *= 1 - out;
    const alpha = 1 - E.move(tw(T, 2.18, 2.50), 2);

    mirror.setAttribute('transform', opts.side === 'right' ? `translate(${W} 0) scale(-1 1)` : '');
    fade.setAttribute('opacity', f(alpha, 4));
    fade.setAttribute('visibility', alpha <= 0.0005 || T <= 0 ? 'hidden' : 'visible');
    icon.setAttribute('transform', [
      `translate(${f(x)} ${f(cy)})`,
      `translate(${f(-iw / 2)} ${f(ih / 2)}) rotate(${f(lean)}) translate(${f(iw / 2)} ${f(-ih / 2)})`,  // lean: pivot on the hidden bottom corner
      `translate(0 ${f(y)})`,
      `rotate(${f(tilt)})`,                                                                            // head tilt: pivot on the centre
      `translate(0 ${f(ih / 2)}) scale(${f(sqx, 4)} ${f(sqy, 4)}) translate(0 ${f(-ih / 2)})`,         // bob: pivot on the bottom
      `scale(${f(s, 5)}) translate(${-V.cx} ${-V.cy})`,
    ].join(' '));
    plus.setAttribute('opacity', f(plusOp, 4));
    plus.setAttribute('transform', `translate(${V.plus.x} ${V.plus.y}) scale(${f(plusS, 4)}) translate(${-V.plus.x} ${-V.plus.y})`);
    const px = S.cx, py = 310;
    smile.setAttribute('transform', `translate(${px} ${f(py - 8 * arc)}) scale(${f(1 + 0.05 * arc, 4)} 1) translate(${-px} ${-py})`);
    smile.setAttribute('opacity', smileP > 0.001 ? 1 : 0);
    const dash = `${f(clamp01(smileP), 4)} 2`;
    sL.setAttribute('stroke-dasharray', dash); sR.setAttribute('stroke-dasharray', dash);
  }

  let auto = !q.has('render'), t0 = null;
  function tick(now) {
    if (!auto) return;
    if (t0 === null) t0 = now;
    render(((now - t0) / 1000) % (DURATION + 0.8));
    requestAnimationFrame(tick);
  }

  window.setTime = function (seconds) { auto = false; render(seconds); return T; };
  window.GDP_MOTION = {
    name: 'GDP Motion 03 — Peek-a-Boo', width: W, height: H, duration: DURATION, ready: Promise.resolve(),
    scenes: [
      { name: 'Ló vào', start: 0, end: 0.45 }, { name: 'Quan sát', start: 0.45, end: 0.85 }, { name: 'Cười', start: 0.85, end: 1.3 },
      { name: 'Chào', start: 1.3, end: 1.85 }, { name: 'Rút về', start: 1.85, end: 2.5 },
    ],
    setTime: window.setTime,
    configure(o) { Object.assign(opts, o || {}); render(T); return { ...opts }; },
    get time() { return T; }, get options() { return { ...opts }; },
  };
  document.documentElement.dataset.ready = '1';
  render(q.has('t') ? num('t', 0) : 0);
  if (auto) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
