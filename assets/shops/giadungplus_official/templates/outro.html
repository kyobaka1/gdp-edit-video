<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  /* THẺ TOÀN KHUNG (card): renderer đặt --w/--h = kích thước video. {{logo}} = logo shop (shop.json logo.files). */
  #label {
    flex-direction: column; gap: calc(var(--h) * 0.035);
    background: radial-gradient(ellipse at 50% 38%, #d42020 0%, #c01818 45%, #7a1010 100%);
    border-radius: 0;
  }
  #logo { width: calc(var(--w) * 0.62); max-height: calc(var(--h) * 0.3); object-fit: contain;
          filter: drop-shadow(0 calc(var(--h) * 0.008) calc(var(--h) * 0.02) rgba(0, 0, 0, 0.35)); }
  #text { color: #ffffff; font-size: calc(var(--h) * 0.05); white-space: nowrap; margin-top: calc(var(--h) * 0.02); }
  #sub { color: #ffe3e3; font-size: calc(var(--h) * 0.03); white-space: nowrap; }
  #rule { width: calc(var(--w) * 0.18); height: max(2px, calc(var(--h) * 0.004)); background: rgba(255, 255, 255, 0.7); border-radius: 9px; }
</style></head>
<body><div id="label"><img id="logo" src="{{logo}}" alt=""><div id="rule"></div><div id="text">{{text}}</div><div id="sub">{{sub}}</div></div></body></html>
