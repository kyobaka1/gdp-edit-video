<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  #label {
    flex-direction: column; gap: calc(var(--h) * 0.04); padding: calc(var(--h) * 0.14) calc(var(--h) * 0.45);
    background: #c01818; border-radius: calc(var(--h) * 0.1);
    border-bottom: max(2px, calc(var(--h) * 0.035)) solid #7a1010;
  }
  #text { color: #ffffff; }
  #sub { color: #ffe9e9; }
</style></head>
<body><div id="label"><div id="text">{{text}}</div><div id="sub">{{sub}}</div></div></body></html>
