<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  #label {
    padding: calc(var(--h) * 0.12) calc(var(--h) * 0.55);
    background: linear-gradient(90deg, #c01818 0%, #a31313 100%);
    border: max(2px, calc(var(--h) * 0.028)) solid #ffffff;
    border-radius: calc(var(--h) * 0.1);
    box-shadow: 0 0 0 1px #7a1010;
  }
  #text { color: #ffffff; text-transform: uppercase; letter-spacing: 0.01em; }
</style></head>
<body><div id="label"><div id="text">{{text}}</div></div></body></html>
