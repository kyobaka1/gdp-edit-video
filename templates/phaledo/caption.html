<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "BVP"; src: url("../../assets/fonts/BeVietnamPro-SemiBold.ttf"); font-weight: 600; }
  html, body { margin: 0; background: transparent; }
  #label {
    width: var(--w); height: var(--h); box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    padding: 0 calc(var(--h) * 0.42);
    background: #161616;
    border: max(2px, calc(var(--h) * 0.035)) solid #b89a6a;
    border-radius: calc(var(--h) * 0.5);
    box-shadow: inset 0 0 0 max(1px, calc(var(--h) * 0.03)) rgba(184, 154, 106, 0.18);
  }
  #text {
    font-family: "BVP", sans-serif; font-weight: 600; font-size: var(--fs);
    line-height: 1.18; letter-spacing: 0.01em; color: #ececec; text-align: center;
  }
</style></head>
<body><div id="label"><div id="text">{{text}}</div></div></body></html>
